<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毎日の日本語 · 每日日语学习</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<div class="app">

  <!-- 侧栏导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brandHome" title="返回首页">
      <div class="brand-mark">日</div>
      <div>
        <div class="brand-name">毎日の日本語</div>
        <div class="brand-sub">每日日语学习</div>
      </div>
    </div>
    <button class="nav-home" id="goHome">
      <span class="nav-kanji">主</span>
      <span class="nav-name">首页 · Home</span>
    </button>
    <div class="nav-label">学习模块</div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">完成模块即可盖上朱印</div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- 移动端顶栏 -->
  <header class="topbar">
    <button class="hamburger" id="hamburger" aria-label="打开菜单">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button class="hamburger" id="goHomeTop" aria-label="返回首页" title="返回首页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
    <div class="brand-name">毎日の日本語</div>
  </header>

  <!-- 主内容区 -->
  <main class="main">
    <!-- 各视图容器（由 app.js 渲染） -->
    <section class="view" id="view-home" data-view="home"></section>
    <section class="view" id="view-listen" data-view="listen"></section>
    <section class="view" id="view-vocab" data-view="vocab"></section>
    <section class="view" id="view-reading" data-view="reading"></section>
    <section class="view" id="view-oral" data-view="oral"></section>
    <section class="view" id="view-kanji" data-view="kanji"></section>
    <section class="view" id="view-game" data-view="game"></section>
    <section class="view" id="view-culture" data-view="culture"></section>
  </main>

</div>

<div class="toast" id="toast"></div>

<script src="data.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
