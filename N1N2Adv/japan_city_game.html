<div class="container">
  <h1 id="gameTitle">🚃 東京駅名クイズ</h1>

  <!-- Game Type Tabs (4 tabs) -->
  <div class="game-tabs">
    <button class="game-tab-btn active" data-game="station" data-view="quiz" onclick="switchGameTab('station', 'quiz')">🚇 駅クイズ</button>

    <button class="game-tab-btn" data-game="city" data-view="quiz" onclick="switchGameTab('city', 'quiz')">🗾 都市クイズ</button>
    <button class="game-tab-btn" data-game="city" data-view="list" onclick="switchGameTab('city', 'list')">📋 都市一覧</button>
  </div>

  <!-- Mode selector (shared) -->
  <div class="top-row-1">
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="simple" onclick="setMode('simple')">首尾文字モード</button>

    </div>
  </div>

  </div>

      </div>

    </div>

    </div>

    </div>

      <div class="input-row">
        <input type="text" id="answerInput" placeholder="駅名をひらがなで入力..." autocomplete="off">

        </button>
        <button class="skip-btn" id="skipBtn" onclick="handleSkip()">わからない</button>

    </div>

</div>

// ===== ゲーム状態 =====
let currentGame = 'station'; // 'station' or 'city'
let currentViewType = 'quiz'; // 'quiz' or 'list'
const maxHints = 3;

// Per-game state
function createGameState() {
  return {
    mode: 'simple',
    wrongNoteMode: false,
    selectedFilters: new Set(),
    currentHeadTail: null,
    correctCount: 0,
    wrongCount: 0,
    streakCount: 0,
    totalQuestions: 0,
    answered: false,
    usedHeadTails: new Set(),
    hintsUsed: 0,
    currentHints: [],
    hintAnswer: null,
    historyList: []
  };
}

const gameState = {
  station: createGameState(),
  city: createGameState()
};

function gs() { return gameState[currentGame]; }

// ===== Data accessors =====
function getDB() { return currentGame === 'station' ? stationDB : placeDB; }
function getGroups() { return currentGame === 'station' ? lineGroups : regionGroups; }
function getGroupItemsKey() { return currentGame === 'station' ? 'lines' : 'prefectures'; }
function getFilterField() { return currentGame === 'station' ? 'line' : 'prefecture'; }
function getItemsKey() { return currentGame === 'station' ? 'stations' : 'places'; }
function getItemLabel() { return currentGame === 'station' ? '駅' : '都市'; }
function getFilterLabel() { return currentGame === 'station' ? '路線' : '都道府県'; }
function getHintLabel() { return currentGame === 'station' ? gs().hintAnswer.line : gs().hintAnswer.prefecture; }

// ===== Unique items =====
function getUniqueItems() {
  const seen = new Set();
  return getDB().filter(item => {
    const key = item.kanji + item.kana;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// ===== Filter initialization =====
function initFilterUI() {
  const groups = getGroups();
  const itemsKey = getGroupItemsKey();
  const isStation = currentGame === 'station';

  // Build inline filter buttons
  const container = isStation ? document.getElementById('filterGroups') : document.getElementById('prefFilterGroups');
  const btnClass = isStation ? 'line-btn' : 'pref-btn';
  const dataAttr = isStation ? 'data-line' : 'data-pref';
  const allLabel = isStation ? '全路線' : '全都道府県';

  let html = '';
  html += `<div class="${isStation ? 'line-group' : 'pref-group'}">`;
  html += `<div class="${isStation ? 'line-group-btns' : 'pref-group-btns'}">`;
  html += `<button class="${btnClass} all-btn active" ${dataAttr}="__all__">${allLabel}</button>`;
  html += '</div></div>';

  groups.forEach(group => {
    html += `<div class="${isStation ? 'line-group' : 'pref-group'}">`;
    html += `<div class="${isStation ? 'line-group-title' : 'pref-group-title'}">${group.name}</div>`;
    html += `<div class="${isStation ? 'line-group-btns' : 'pref-group-btns'}">`;
    html += group[itemsKey].map(item =>
      `<button class="${btnClass}" ${dataAttr}="${item}">${item}</button>`
    ).join('');
    html += '</div></div>';
  });

  container.innerHTML = html;

  // Event delegation
  function handleBtnClick(e) {
    const btn = e.target.closest(`.${btnClass}`);
    if (!btn) return;

    const value = isStation ? btn.dataset.line : btn.dataset.pref;
    const state = gs();

    if (value === '__all__') {
      state.selectedFilters.clear();
      container.querySelectorAll(`.${btnClass}`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    } else {
      const allBtn = container.querySelector(`.${btnClass}.all-btn`);
      allBtn.classList.remove('active');

      if (state.selectedFilters.has(value)) {
        state.selectedFilters.delete(value);
        btn.classList.remove('active');
        if (state.selectedFilters.size === 0) {
          allBtn.classList.add('active');
        }
      } else {
        state.selectedFilters.add(value);
        btn.classList.add('active');
      }
    }

    updateSelectedFilterCount();
    state.usedHeadTails.clear();
    nextQuestion();
  }

  container.addEventListener('click', handleBtnClick);
}

function updateSelectedFilterCount() {
  const state = gs();
  const isStation = currentGame === 'station';
  const countEl = isStation ? document.getElementById('selectedFilterCount') : document.getElementById('selectedPrefCountDisplay');
  const allLabel = isStation ? '全路線' : '全都道府県';
  const unit = isStation ? '路線' : '都道府県';

  if (state.selectedFilters.size === 0) {
    countEl.textContent = `（${allLabel}）`;
  } else {
    countEl.textContent = `（${state.selectedFilters.size}${unit}）`;
  }
}

// Toggle filter panel
function toggleFilter() {
  const filterEl = currentGame === 'station' ? document.getElementById('lineFilter') : document.getElementById('prefFilter');
  filterEl.classList.toggle('open');
}

// ===== Get filtered items =====
function getFilteredItems() {
  let filtered = getDB().slice();
  const state = gs();
  const filterField = getFilterField();

  // Wrong note mode
  if (state.wrongNoteMode) {
    const wrongKanjiSet = new Set();
    state.historyList.forEach(item => {
      if (item.sampleItem) {
        wrongKanjiSet.add(item.sampleItem.kanji);
      }
    });
    filtered = filtered.filter(item => wrongKanjiSet.has(item.kanji));
  } else if (state.selectedFilters.size > 0) {
    filtered = filtered.filter(item => state.selectedFilters.has(item[filterField]));
  }

  // Deduplicate
  const seen = new Set();
  filtered = filtered.filter(item => {
    const key = item.kanji + item.kana;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  return filtered;
}

// ===== Head-tail groups =====
function buildHeadTailGroups(items) {
  const groups = {};
  items.forEach(item => {
    const first = item.kana[0];
    const last = item.kana[item.kana.length - 1];
    const key = first + '→' + last;
    if (!groups[key]) {
      groups[key] = { first, last, items: [] };
    }
    groups[key].items.push(item);
  });
  return groups;
}

function pickRandomHeadTail() {
  const filtered = getFilteredItems();
  const groups = buildHeadTailGroups(filtered);
  const groupKeys = Object.keys(groups);
  const state = gs();

  if (groupKeys.length === 0) return null;

  if (state.usedHeadTails.size >= groupKeys.length) {
    state.usedHeadTails.clear();
  }

  const unusedKeys = groupKeys.filter(k => !state.usedHeadTails.has(k));
  const key = unusedKeys[Math.floor(Math.random() * unusedKeys.length)];

  state.usedHeadTails.add(key);
  return groups[key];
}

function findMatchingItems(firstKana, lastKana) {
  return getFilteredItems().filter(item =>
    item.kana[0] === firstKana && item.kana[item.kana.length - 1] === lastKana
  );
}

// ===== Answer check =====
function checkAnswer(userInput) {
  const normalized = userInput.trim().toLowerCase();
  const items = gs().currentHeadTail.items;

  const matched = items.find(item =>
    normalized === item.kana || normalized === item.kanji
  );

  return matched || null;
}

// ===== Hint system =====
function getNextHint() {
  const item = gs().hintAnswer;
  const kana = item.kana;
  const hintLabel = getHintLabel();

  let availableMiddleChars = [];
  if (kana.length > 2) {
    availableMiddleChars = kana.slice(1, -1).split('');
  }

  const usedMiddleChars = gs().currentHints
    .map(h => {
      const m = h.match(/途中に「(.)」/);
      return m ? m[1] : null;
    })
    .filter(c => c !== null);

  const remainingMiddle = availableMiddleChars.filter(c => !usedMiddleChars.includes(c));

  switch (gs().hintsUsed) {
    case 0:
      return `文字数は ${kana.length} 文字です`;
    case 1:
      if (remainingMiddle.length > 0) {
        const char = remainingMiddle[Math.floor(Math.random() * remainingMiddle.length)];
        return `途中に「${char}」が含まれます`;
      }
      return currentGame === 'station' ? `路線の一つに「${hintLabel}」があります` : `都道府県は「${hintLabel}」です`;
    case 2:
      if (remainingMiddle.length > 1) {
        const others = remainingMiddle.filter(c => !usedMiddleChars.includes(c));
        const char = others[Math.floor(Math.random() * others.length)];
        return `途中に「${char}」も含まれます`;
      }
      return currentGame === 'station' ? `路線の一つに「${hintLabel}」があります` : `都道府県は「${hintLabel}」です`;
    default:
      return null;
  }
}

function useHint() {
  const state = gs();
  if (state.answered) return;

  if (state.hintsUsed >= maxHints) {
    showResult(false, null);
    return;
  }

  const hintText = getNextHint();
  if (!hintText) return;

  state.hintsUsed++;
  state.currentHints.push(hintText);

  const hintDisplay = document.getElementById('hintDisplay');
  const hintItems = document.getElementById('hintItems');

  hintDisplay.classList.add('show');
  hintItems.innerHTML = state.currentHints.map(h =>
    `<div class="hint-item">${h}</div>`
  ).join('');

  const hintBtn = document.getElementById('hintBtn');
  const remaining = maxHints - state.hintsUsed;
  if (remaining > 0) {
    document.getElementById('hintCount').textContent = remaining;
  } else {
    hintBtn.innerHTML = '答えを見る';
    hintBtn.classList.add('reveal-mode');
  }
}

// ===== History =====
function addToHistory(isCorrect, userAnswer) {
  const state = gs();
  if (isCorrect && state.hintsUsed === 0) return;

  state.historyList.unshift({
    headTail: state.currentHeadTail.first + '→' + state.currentHeadTail.last,
    answerCount: state.currentHeadTail.items.length,
    userAnswer: userAnswer,
    isCorrect: isCorrect,
    hintsUsed: state.hintsUsed,
    hints: [...state.currentHints],
    sampleItem: state.hintAnswer
  });

  if (state.historyList.length > 30) {
    state.historyList = state.historyList.slice(0, 30);
  }

  renderHistory();
  updateWrongNoteCount();
}

function renderHistory() {
  const state = gs();
  const historyEl = document.getElementById('historyList');

  if (state.historyList.length === 0) {
    historyEl.innerHTML = '<div class="history-empty">まだ履歴はありません</div>';
    return;
  }

  const itemClass = currentGame === 'station' ? 'history-station' : 'history-place';
  const tagClass = currentGame === 'station' ? 'line-tag' : 'pref-tag';
  const unit = getItemLabel();

  historyEl.innerHTML = state.historyList.map((item, idx) => {
    const statusClass = item.isCorrect ? '' : 'wrong';
    const hintClass = item.hintsUsed > 0 && item.isCorrect ? 'hint-used' : '';
    const icon = item.isCorrect ? (item.hintsUsed > 0 ? '💡' : '✅') : '❌';

    let tags = `<span class="history-tag">${item.headTail}</span>`;
    tags += `<span class="history-tag ${tagClass}">全${item.answerCount}${unit}</span>`;
    if (item.hintsUsed > 0) {
      tags += `<span class="history-tag hint-tag">ヒント×${item.hintsUsed}</span>`;
    }

    const answerText = item.userAnswer
      ? `あなたの答え: ${item.userAnswer}`
      : 'スキップ';

    return `
      <div class="history-item ${statusClass} ${hintClass}">
        <div class="history-icon">${icon}</div>
        <div class="history-content">
          <div class="${itemClass}">${item.sampleItem.kanji}（${item.sampleItem.kana}）</div>
          <div class="history-kana">${answerText}</div>
          <div class="history-meta">
            ${tags}
          </div>
          ${item.hints.length > 0 ? `
            <div style="margin-top:6px; font-size:0.8rem; color:#f0c060;">
              ${item.hints.map((h, i) => `💡 ${h}`).join('<br>')}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function clearHistory() {
  const state = gs();
  if (state.historyList.length === 0) return;
  if (confirm('履歴をクリアしますか？')) {
    state.historyList = [];
    renderHistory();
    updateWrongNoteCount();
  }
}

function updateWrongNoteCount() {
  const state = gs();
  const wrongKanjiSet = new Set();
  state.historyList.forEach(item => {
    if (item.sampleItem) {
      wrongKanjiSet.add(item.sampleItem.kanji);
    }
  });
  document.getElementById('wrongNoteCount').textContent = wrongKanjiSet.size;
}

function toggleWrongNote() {
  const state = gs();
  state.wrongNoteMode = !state.wrongNoteMode;
  const btn = document.getElementById('wrongNoteToggle');
  const filterEl = currentGame === 'station' ? document.getElementById('lineFilter') : document.getElementById('prefFilter');

  if (state.wrongNoteMode) {
    btn.classList.add('active');
    filterEl.style.opacity = '0.4';
    filterEl.style.pointerEvents = 'none';
  } else {
    btn.classList.remove('active');
    filterEl.style.opacity = '1';
    filterEl.style.pointerEvents = 'auto';
  }

  state.usedHeadTails.clear();
  nextQuestion();
}

// ===== Kana display =====
function renderKanaDisplay() {
  const state = gs();
  const display = document.getElementById('kanaDisplay');
  const firstKana = state.currentHeadTail.first;
  const lastKana = state.currentHeadTail.last;

  let html = `
    <div class="kana-box kana-first">
      <span class="label">最初の文字</span>
      ${firstKana}
    </div>
    <div class="arrow">→</div>
  `;

  if (state.mode === 'hint') {
    const item = state.hintAnswer;
    if (item.kana.length > 2) {
      const middle = item.kana.slice(1, -1).split('');
      const shuffled = middle.sort(() => Math.random() - 0.5).slice(0, 2);
      shuffled.forEach((kana, i) => {
        html += `
          <div class="kana-box kana-middle">
            <span class="label">ヒント${i + 1}</span>
            ${kana}
          </div>
        `;
      });
      html += '<div class="arrow">→</div>';
    }
  }

  html += `
    <div class="kana-box kana-last">
      <span class="label">最後の文字</span>
      ${lastKana}
    </div>
  `;

  display.innerHTML = html;

  document.querySelectorAll('.kana-box').forEach(box => {
    box.classList.add('pulse');
    setTimeout(() => box.classList.remove('pulse'), 500);
  });
}

// ===== Show result =====
function showResult(isCorrect, userAnswer) {
  const state = gs();
  state.answered = true;
  const resultArea = document.getElementById('resultArea');
  const resultIcon = document.getElementById('resultIcon');
  const resultText = document.getElementById('resultText');
  const answerList = document.getElementById('answerList');
  const answerCount = document.getElementById('answerCount');
  const userAnswerInfo = document.getElementById('userAnswerInfo');
  const answerUnit = document.getElementById('answerUnit');
  const answerUnitLabel = document.getElementById('answerUnitLabel');

  const items = state.currentHeadTail.items;
  const uniqueCount = new Set(items.map(i => i.kanji)).size;
  const unit = getItemLabel();

  answerUnit.textContent = unit;
  answerUnitLabel.textContent = unit;

  if (isCorrect) {
    state.correctCount++;
    state.streakCount++;
    resultArea.className = 'result-area show result-correct';
    resultIcon.textContent = '✅';
    resultText.textContent = uniqueCount > 1 ? `正解！この首尾の${unit}は他にもあります👇` : '正解！';
  } else {
    state.wrongCount++;
    state.streakCount = 0;
    resultArea.className = 'result-area show result-wrong';
    resultIcon.textContent = '❌';
    resultText.textContent = userAnswer ? '残念、不正解... 正解は👇' : '正解は👇';
  }

  state.totalQuestions++;

  // User answer display
  const userExtra = document.getElementById('userExtra');
  if (userAnswer && !isCorrect) {
    userAnswerInfo.style.display = 'flex';
    document.getElementById('userKanji').textContent = userAnswer;
    document.getElementById('userKana').textContent = '';
    userExtra.style.display = 'inline-block';
    userExtra.textContent = 'あなたの答え';
    userExtra.className = currentGame === 'station' ? 'station-line' : 'place-pref';
  } else {
    userAnswerInfo.style.display = 'none';
  }

  answerCount.textContent = uniqueCount;

  // Group by kanji and collect filter values
  const filterField = getFilterField();
  const uniqueByKanji = {};
  items.forEach(item => {
    if (!uniqueByKanji[item.kanji]) {
      uniqueByKanji[item.kanji] = { kanji: item.kanji, kana: item.kana, extras: [] };
    }
    if (!uniqueByKanji[item.kanji].extras.includes(item[filterField])) {
      uniqueByKanji[item.kanji].extras.push(item[filterField]);
    }
  });

  const tagClass = currentGame === 'station' ? 'line-tag' : 'pref-tag';
  const clickClass = currentGame === 'station' ? 'clickable-line' : 'clickable-pref';
  const clickFn = currentGame === 'station' ? 'showItemModal' : 'showItemModal';

  answerList.innerHTML = Object.values(uniqueByKanji).map(i => `
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 8px;">
      <div>
        <span style="font-weight: bold; font-size: 0.95rem;">${i.kanji}</span>
        <span style="color: #a0a0c0; font-size: 0.85rem; margin-left: 6px;">（${i.kana}）</span>
      </div>
      <div style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end;">
        ${i.extras.map(ex => `<span class="history-tag ${tagClass} ${clickClass}" onclick="showItemModal('${ex}')">${ex} ↗</span>`).join('')}
      </div>
    </div>
  `).join('');

  updateScore();
  updateProgress();
  addToHistory(isCorrect, userAnswer);
}

function updateScore() {
  const state = gs();
  document.getElementById('correctCount').textContent = state.correctCount;
  document.getElementById('wrongCount').textContent = state.wrongCount;
  document.getElementById('streakCount').textContent = state.streakCount;
}

function updateProgress() {
  const state = gs();
  const filtered = getFilteredItems();
  const groups = buildHeadTailGroups(filtered);
  const total = Object.keys(groups).length;
  const current = state.usedHeadTails.size;
  const progress = total > 0 ? Math.min((current / total) * 100, 100) : 0;
  document.getElementById('progressFill').style.width = progress + '%';

  let label = `${current} / ${total}`;
  if (state.wrongNoteMode) {
    label = `📝 間違えノート: ${label}`;
  }
  document.getElementById('progressText').textContent = label;
}

// ===== Next question =====
function nextQuestion() {
  const ht = pickRandomHeadTail();
  const state = gs();
  const unit = getItemLabel();

  if (!ht) {
    if (state.wrongNoteMode) {
      alert(`間違えノートが空です。まずは問題を解いて、間違えた${unit}を溜めましょう！`);
    } else {
      alert(`該当する${unit}がありません。${getFilterLabel()}の選択を変更してください。`);
    }
    return;
  }

  state.currentHeadTail = ht;
  state.hintAnswer = ht.items[Math.floor(Math.random() * ht.items.length)];

  state.answered = false;
  state.hintsUsed = 0;
  state.currentHints = [];

  document.getElementById('answerInput').value = '';
  document.getElementById('resultArea').className = 'result-area';
  document.getElementById('hintSection').style.display = state.mode === 'hint' ? 'block' : 'none';
  document.getElementById('hintDisplay').classList.remove('show');
  document.getElementById('hintItems').innerHTML = '';

  const hintBtn = document.getElementById('hintBtn');
  hintBtn.disabled = false;
  hintBtn.classList.remove('reveal-mode');
  hintBtn.innerHTML = `ヒント<span class="hint-count" id="hintCount">${maxHints}</span>`;

  // Update placeholder
  document.getElementById('answerInput').placeholder = currentGame === 'station'
    ? '駅名をひらがなで入力...'
    : '都市名をひらがなで入力...';

  // Hint kana section
  if (state.mode === 'hint') {
    const hintKana = document.getElementById('hintKana');
    const item = state.hintAnswer;
    if (item.kana.length > 2) {
      const middle = item.kana.slice(1, -1).split('');
      const shuffled = middle.sort(() => Math.random() - 0.5).slice(0, 2);
      hintKana.innerHTML = shuffled.map(k =>
        `<span style="background: rgba(243,156,18,0.2); padding: 4px 10px; border-radius: 8px; font-size: 1.1rem;">${k}</span>`
      ).join('');
    } else {
      hintKana.innerHTML = '<span style="color: #8080a0;">（2文字のため途中文字なし）</span>';
    }
  }

  renderKanaDisplay();
  document.getElementById('answerInput').focus();
}

// ===== Event handlers =====
function handleSubmit() {
  const state = gs();
  if (state.answered) return;
  const input = document.getElementById('answerInput').value.trim();
  if (!input) return;
  const matched = checkAnswer(input);
  showResult(matched !== null, input);
}

function handleSkip() {
  const state = gs();
  if (state.answered) return;
  showResult(false, null);
}

function setMode(mode) {
  const state = gs();
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  state.usedHeadTails.clear();
  nextQuestion();
}

// Enter key handler
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('answerInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (gs().answered) {
        nextQuestion();
      } else {
        const input = e.target.value.trim();
        if (input) {
          const matched = checkAnswer(input);
          showResult(matched !== null, input);
        }
      }
    }
  });
});

// ===== Game tab switching =====
function switchGameTab(game, view) {
  currentGame = game;
  currentViewType = view;

  // Update tab buttons
  document.querySelectorAll('.game-tab-btn').forEach(btn => {
    const isActive = btn.dataset.game === game && btn.dataset.view === view;
    btn.classList.toggle('active', isActive);
  });

  // Update title
  const titleEl = document.getElementById('gameTitle');
  const subtitleEl = document.getElementById('gameSubtitle');
  if (game === 'station') {
    titleEl.textContent = '🚃 東京駅名クイズ';
    subtitleEl.textContent = '首尾の文字から駅名を当てよう！';
  } else {
    titleEl.textContent = '🗾 日本都市かなクイズ';
    subtitleEl.textContent = '首尾の文字から都市名を当てよう！';
  }

  // Show/hide appropriate filter
  const lineFilter = document.getElementById('lineFilter');
  const prefFilter = document.getElementById('prefFilter');
  if (game === 'station') {
    lineFilter.style.display = '';
    prefFilter.style.display = 'none';
  } else {
    lineFilter.style.display = 'none';
    prefFilter.style.display = '';
  }

  // Update mode buttons
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === gs().mode);
  });

  // Update wrong note toggle
  const wnBtn = document.getElementById('wrongNoteToggle');
  wnBtn.classList.toggle('active', gs().wrongNoteMode);
  const activeFilter = game === 'station' ? lineFilter : prefFilter;
  activeFilter.style.opacity = gs().wrongNoteMode ? '0.4' : '1';
  activeFilter.style.pointerEvents = gs().wrongNoteMode ? 'none' : 'auto';

  // Update search placeholder
  const slSearch = document.getElementById('slSearch');
  if (game === 'station') {
    slSearch.placeholder = '🔍 駅名・かな・路線で検索...';
  } else {
    slSearch.placeholder = '🔍 都市名・かな・都道府県で検索...';
  }

  // Switch view
  const gameView = document.getElementById('gameView');
  const listView = document.getElementById('listView');

  if (view === 'quiz') {
    gameView.classList.remove('hide');
    listView.classList.remove('show');
    updateScore();
    updateProgress();
    updateSelectedFilterCount();
    updateWrongNoteCount();
    renderHistory();
    nextQuestion();
  } else {
    gameView.classList.add('hide');
    listView.classList.add('show');
    slSearch.value = '';
    renderListView('');
  }

  // Update footer
  updateFooter();
}

function updateFooter() {
  const unique = getUniqueItems();
  const footerEl = document.getElementById('footerText');
  if (currentGame === 'station') {
    footerEl.innerHTML = `東京メトロ・都営地下鉄・JR・私鉄 計 ${unique.length} 駅収録`;
  } else {
    footerEl.innerHTML = `47都道府県・主要都市 計 ${unique.length} 件収録`;
  }
}

// ===== List View =====
function buildItemMap() {
  const map = {};
  const filterField = getFilterField();
  getDB().forEach(item => {
    const key = item[filterField];
    if (!map[key]) {
      map[key] = [];
    }
    if (!map[key].find(x => x.kanji === item.kanji)) {
      map[key].push({ kanji: item.kanji, kana: item.kana });
    }
  });
  return map;
}

function renderListView(searchQuery) {
  const container = document.getElementById('slGroups');
  const indexContainer = document.getElementById('slIndex');
  const itemMap = buildItemMap();
  const query = searchQuery.toLowerCase().trim();
  const groups = getGroups();
  const itemsKey = getGroupItemsKey();
  const isStation = currentGame === 'station';

  const containerClass = isStation ? 'sl-line' : 'sl-pref';
  const headerClass = isStation ? 'sl-line-header' : 'sl-pref-header';
  const nameClass = isStation ? 'sl-line-name' : 'sl-pref-name';
  const countClass = isStation ? 'sl-line-count' : 'sl-pref-count';
  const toggleClass = isStation ? 'sl-line-toggle' : 'sl-pref-toggle';
  const stationsClass = isStation ? 'sl-line-stations' : 'sl-pref-places';
  const rowClass = isStation ? 'sl-station-row' : 'sl-place-row';
  const nameItemClass = isStation ? 'sl-station-name' : 'sl-place-name';
  const kanaClass = isStation ? 'sl-station-kana' : 'sl-place-kana';
  const arrowClass = isStation ? 'sl-station-arrow' : 'sl-place-arrow';
  const unit = getItemLabel();

  const visibleGroups = groups.filter(group => {
    return group[itemsKey].some(itemKey => {
      if (!query) return true;
      if (itemKey.toLowerCase().includes(query)) return true;
      const items = itemMap[itemKey] || [];
      return items.some(i =>
        i.kanji.toLowerCase().includes(query) ||
        i.kana.toLowerCase().includes(query)
      );
    });
  });

  if (!query && visibleGroups.length > 0) {
    indexContainer.style.display = 'flex';
    indexContainer.innerHTML = visibleGroups.map((g, i) => `
      <button class="sl-index-btn" onclick="document.getElementById('sl-group-${i}').scrollIntoView({behavior:'smooth',block:'start'})">
        ${g.name}
      </button>
    `).join('');
  } else {
    indexContainer.style.display = 'none';
  }

  let html = '';

  visibleGroups.forEach((group, groupIdx) => {
    const groupItems = group[itemsKey].filter(itemKey => {
      if (!query) return true;
      if (itemKey.toLowerCase().includes(query)) return true;
      const items = itemMap[itemKey] || [];
      return items.some(i =>
        i.kanji.toLowerCase().includes(query) ||
        i.kana.toLowerCase().includes(query)
      );
    });

    if (groupItems.length === 0) return;

    html += `<div class="sl-category-title" id="sl-group-${groupIdx}">${group.name}</div>`;

    groupItems.forEach(itemKey => {
      const items = itemMap[itemKey] || [];
      let filteredItems = items;
      if (query) {
        filteredItems = items.filter(i =>
          i.kanji.toLowerCase().includes(query) ||
          i.kana.toLowerCase().includes(query)
        );
      }
      if (filteredItems.length === 0 && query) return;

      const itemHtml = filteredItems.map((s, i) => `
        <span class="${nameItemClass}">${s.kanji}<span class="${kanaClass}">${s.kana}</span></span>
        ${i < filteredItems.length - 1 ? `<span class="${arrowClass}">→</span>` : ''}
      `).join('');

      html += `
        <div class="${containerClass}">
          <div class="${headerClass}" onclick="this.parentElement.classList.toggle('open')">
            <span>
              <span class="${nameClass}">${itemKey}</span>
              <span class="${countClass}">${items.length}${unit}</span>
            </span>
            <span class="${toggleClass}">▼</span>
          </div>
          <div class="${stationsClass}">
            <div class="${rowClass}">${itemHtml}</div>
          </div>
        </div>
      `;
    });
  });

  if (!html) {
    const label = isStation ? '路線・駅' : '都道府県・都市';
    html = `<div style="text-align: center; color: #8080a0; padding: 40px 0;">該当する${label}がありません</div>`;
  }

  container.innerHTML = html;
}

// ===== Filter Select Modal =====
function openFilterSelectModal() {
  const isStation = currentGame === 'station';
  const modal = document.getElementById(isStation ? 'lineSelectModal' : 'prefSelectModal');
  const container = document.getElementById(isStation ? 'lsModalGroups' : 'psModalGroups');
  const allBtn = document.getElementById(isStation ? 'lsSelectAll' : 'psSelectAll');
  const clearBtn = document.getElementById(isStation ? 'lsClearAll' : 'psClearAll');
  const groups = getGroups();
  const itemsKey = getGroupItemsKey();
  const btnClass = isStation ? 'line-btn' : 'pref-btn';
  const dataAttr = isStation ? 'data-line' : 'data-pref';
  const state = gs();

  let html = '';
  groups.forEach((group, gi) => {
    html += `
      <div class="${isStation ? 'ls-modal-group' : 'ps-modal-group'}">
        <div class="${isStation ? 'ls-modal-group-title' : 'ps-modal-group-title'}">${group.name}</div>
        <div class="${isStation ? 'ls-modal-group-btns' : 'ps-modal-group-btns'}">
          ${group[itemsKey].map(item => {
            const isActive = state.selectedFilters.has(item);
            return `<button class="${btnClass} ${isActive ? 'active' : ''}" type="button" ${dataAttr}="${item}">${item}</button>`;
          }).join('')}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;

  allBtn.classList.toggle('active', state.selectedFilters.size === 0);

  function handleClick(e) {
    const btn = e.target.closest(`.${btnClass}`);
    if (!btn) return;

    const value = isStation ? btn.dataset.line : btn.dataset.pref;
    if (value === '__all__') {
      state.selectedFilters.clear();
      container.querySelectorAll(`.${btnClass}`).forEach(b => b.classList.remove('active'));
      allBtn.classList.add('active');
    } else {
      allBtn.classList.remove('active');
      if (state.selectedFilters.has(value)) {
        state.selectedFilters.delete(value);
        btn.classList.remove('active');
        if (state.selectedFilters.size === 0) {
          allBtn.classList.add('active');
        }
      } else {
        state.selectedFilters.add(value);
        btn.classList.add('active');
      }
    }
  }

  container.onclick = handleClick;
  allBtn.onclick = function() {
    state.selectedFilters.clear();
    container.querySelectorAll(`.${btnClass}`).forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
  };
  clearBtn.onclick = function() {
    state.selectedFilters.clear();
    container.querySelectorAll(`.${btnClass}`).forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
  };

  modal.classList.add('show');

  modal.onclick = function(e) {
    if (e.target === modal) closeFilterSelectModal();
  };
}

function closeFilterSelectModal() {
  const isStation = currentGame === 'station';
  const modal = document.getElementById(isStation ? 'lineSelectModal' : 'prefSelectModal');
  if (modal) modal.classList.remove('show');

  try {
    updateSelectedFilterCount();
    gs().usedHeadTails.clear();
    nextQuestion();
  } catch (e) {
    console.error('closeFilterSelectModal error:', e);
  }
}

// ===== Item Modal (line/pref info) =====
function showItemModal(name) {
  const isStation = currentGame === 'station';
  const modal = document.getElementById(isStation ? 'lineModal' : 'prefModal');
  const title = document.getElementById(isStation ? 'modalTitle' : 'prefModalTitle');
  const content = document.getElementById(isStation ? 'modalContent' : 'prefModalContent');
  const itemMap = buildItemMap();
  const items = itemMap[name] || [];
  const unit = getItemLabel();

  title.textContent = `${name}（全${items.length}${unit}）`;

  const rowClass = isStation ? 'sl-station-row' : 'sl-place-row';
  const nameClass = isStation ? 'sl-station-name' : 'sl-place-name';
  const kanaClass = isStation ? 'sl-station-kana' : 'sl-place-kana';
  const arrowClass = isStation ? 'sl-station-arrow' : 'sl-place-arrow';

  const itemHtml = items.map((s, i) => `
    <span class="${nameClass}">${s.kanji}<span class="${kanaClass}">${s.kana}</span></span>
    ${i < items.length - 1 ? `<span class="${arrowClass}">→</span>` : ''}
  `).join('');

  content.innerHTML = `<div class="${rowClass}">${itemHtml}</div>`;

  modal.classList.add('show');
}

function closeItemModal() {
  const isStation = currentGame === 'station';
  document.getElementById(isStation ? 'lineModal' : 'prefModal').classList.remove('show');
}

// Escape key for modals
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeItemModal();
    const lineModal = document.getElementById('lineSelectModal');
    const prefModal = document.getElementById('prefSelectModal');
    if (lineModal && lineModal.classList.contains('show')) closeFilterSelectModal();
    if (prefModal && prefModal.classList.contains('show')) closeFilterSelectModal();
  }
});

// ===== Global function registrations (for inline onclick) =====
window.switchGameTab = switchGameTab;
window.setMode = setMode;
window.handleSubmit = handleSubmit;
window.handleSkip = handleSkip;
window.nextQuestion = nextQuestion;
window.useHint = useHint;
window.clearHistory = clearHistory;
window.toggleWrongNote = toggleWrongNote;
window.openFilterSelectModal = openFilterSelectModal;
window.closeFilterSelectModal = closeFilterSelectModal;
window.showItemModal = showItemModal;
window.closeItemModal = closeItemModal;
window.renderListView = renderListView;

// ===== Initialization =====
document.addEventListener('DOMContentLoaded', function() {
  // Initialize both filter UIs
  currentGame = 'station';
  initFilterUI();
  currentGame = 'city';
  initFilterUI();
  currentGame = 'station';

  // Set up modal close buttons
  document.getElementById('lineSelectClose').addEventListener('click', closeFilterSelectModal);
  document.getElementById('lsModalDone').addEventListener('click', closeFilterSelectModal);
  document.getElementById('lineSelectModal').addEventListener('click', function(e) {
    if (e.target.id === 'lineSelectModal') closeFilterSelectModal();
  });

  document.getElementById('prefSelectClose').addEventListener('click', closeFilterSelectModal);
  document.getElementById('psModalDone').addEventListener('click', closeFilterSelectModal);
  document.getElementById('prefSelectModal').addEventListener('click', function(e) {
    if (e.target.id === 'prefSelectModal') closeFilterSelectModal();
  });

  document.getElementById('modalClose').addEventListener('click', closeItemModal);
  document.getElementById('lineModal').addEventListener('click', function(e) {
    if (e.target.id === 'lineModal') closeItemModal();
  });

  document.getElementById('prefModalClose').addEventListener('click', closeItemModal);
  document.getElementById('prefModal').addEventListener('click', function(e) {
    if (e.target.id === 'prefModal') closeItemModal();
  });

  // URL params
  const params = new URLSearchParams(window.location.search);
  const gameParam = params.get('game');
  const viewParam = params.get('view');

  let initialGame = 'station';
  let initialView = 'quiz';

  if (gameParam === 'city') initialGame = 'city';
  if (viewParam === 'list') initialView = 'list';

  // Start game
  switchGameTab(initialGame, initialView);
});
</script>
