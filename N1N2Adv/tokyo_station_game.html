      </div>
    </div>

  <div class="game-card">

    </div>

    </div>

    </div>

      </div>

</div>

// Get unique stations (deduplicate by kana+kanji)
function getUniqueStations() {
  const seen = new Set();
  return stationDB.filter(s => {
    const key = s.kanji + s.kana;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

const uniqueStations = getUniqueStations();
document.getElementById('totalStations').textContent = uniqueStations.length;

// Initialize line filter UI
function initLineFilter() {
  const container = document.getElementById('lineFilterGroups');
  let html = '';
  
  // "All lines" button
  html += `
    <div class="line-group">
      <div class="line-group-btns">
        <button class="line-btn all-btn active" data-line="__all__">全路線</button>
      </div>
    </div>
  `;
  
  lineGroups.forEach(group => {
    html += `
      <div class="line-group">
        <div class="line-group-title">${group.name}</div>
        <div class="line-group-btns">
          ${group.lines.map(line => 
            `<button class="line-btn" data-line="${line}">${line}</button>`
          ).join('')}
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
  
  // Use event delegation for more reliable click handling
  function handleLineBtnClick(e) {
    const btn = e.target.closest('.line-btn');
    if (!btn) return;
    
    const line = btn.dataset.line;
    
    if (line === '__all__') {
      selectedLines.clear();
      container.querySelectorAll('.line-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    } else {
      const allBtn = container.querySelector('.line-btn.all-btn');
      allBtn.classList.remove('active');
      
      if (selectedLines.has(line)) {
        selectedLines.delete(line);
        btn.classList.remove('active');
        if (selectedLines.size === 0) {
          allBtn.classList.add('active');
        }
      } else {
        selectedLines.add(line);
        btn.classList.add('active');
      }
    }
    
    updateSelectedLineCount();
    usedHeadTails.clear();
    nextQuestion();
  }
  
  container.addEventListener('click', handleLineBtnClick);
}

function updateSelectedLineCount() {
  const countEl = document.getElementById('selectedLineCount');
  if (selectedLines.size === 0) {
    countEl.textContent = '（全路線）';
  } else {
    countEl.textContent = `（${selectedLines.size}路線）`;
  }
}

// Get filtered stations based on selected lines and wrong note mode
function getFilteredStations() {
  // 元のDBからフィルターして、その後で重複排除
  // （uniqueStations を使うと路線情報が1つしか残らず、路線フィルターが漏れるため）
  let filtered = stationDB.slice();
  
  // Wrong note mode: use stations from history (wrong answers + hint-used answers)
  if (wrongNoteMode) {
    const wrongKanjiSet = new Set();
    historyList.forEach(item => {
      if (item.sampleStation) {
        wrongKanjiSet.add(item.sampleStation.kanji);
      }
    });
    filtered = filtered.filter(s => wrongKanjiSet.has(s.kanji));
  } else if (selectedLines.size > 0) {
    // Filter by selected lines
    filtered = filtered.filter(s => selectedLines.has(s.line));
  }
  
  // 重複排除（漢字ベースで最初の1件を採用）
  const seen = new Set();
  filtered = filtered.filter(s => {
    const key = s.kanji + s.kana;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  
  return filtered;
}

// Build head-tail groups from filtered stations
function buildHeadTailGroups(stations) {
  const groups = {};
  stations.forEach(s => {
    const first = s.kana[0];
    const last = s.kana[s.kana.length - 1];
    const key = first + '→' + last;
    if (!groups[key]) {
      groups[key] = { first, last, stations: [] };
    }
    groups[key].stations.push(s);
  });
  return groups;
}

// Pick a random head-tail combination (cover all before repeating)
function pickRandomHeadTail() {
  const filtered = getFilteredStations();
  const groups = buildHeadTailGroups(filtered);
  const groupKeys = Object.keys(groups);
  
  if (groupKeys.length === 0) return null;
  
  // Reset only when ALL used (100% coverage)
  if (usedHeadTails.size >= groupKeys.length) {
    usedHeadTails.clear();
  }
  
  // Pick from unused ones
  const unusedKeys = groupKeys.filter(k => !usedHeadTails.has(k));
  const key = unusedKeys[Math.floor(Math.random() * unusedKeys.length)];
  
  usedHeadTails.add(key);
  return groups[key];
}

// Find all stations matching head and tail kana
function findMatchingStations(firstKana, lastKana) {
  return getFilteredStations().filter(s => 
    s.kana[0] === firstKana && s.kana[s.kana.length - 1] === lastKana
  );
}

// Check if user input matches any station with current head-tail
function checkAnswer(userInput) {
  const normalized = userInput.trim().toLowerCase();
  const stations = currentHeadTail.stations;
  
  // Check if input matches any station (kana or kanji)
  const matched = stations.find(s => 
    normalized === s.kana || normalized === s.kanji
  );
  
  return matched || null;
}

// Get hint content based on hint level
function getNextHint() {
  const station = hintAnswerStation;
  const kana = station.kana;
  const line = station.line;
  
  let availableMiddleChars = [];
  if (kana.length > 2) {
    availableMiddleChars = kana.slice(1, -1).split('');
  }
  
  // Get hints used so far to avoid repeating middle chars
  const usedMiddleChars = currentHints
    .map(h => {
      const m = h.match(/途中に「(.)」/);
      return m ? m[1] : null;
    })
    .filter(c => c !== null);
  
  const remainingMiddle = availableMiddleChars.filter(c => !usedMiddleChars.includes(c));
  
  switch (hintsUsed) {
    case 0:
      return `文字数は ${kana.length} 文字です`;
    case 1:
      if (remainingMiddle.length > 0) {
        const char = remainingMiddle[Math.floor(Math.random() * remainingMiddle.length)];
        return `途中に「${char}」が含まれます`;
      }
      return `路線の一つに「${line}」があります`;
    case 2:
      if (remainingMiddle.length > 1) {
        const others = remainingMiddle.filter(c => !usedMiddleChars.includes(c));
        const char = others[Math.floor(Math.random() * others.length)];
        return `途中に「${char}」も含まれます`;
      }
      return `路線の一つに「${line}」があります`;
    default:
      return null;
  }
}

// Use a hint
function useHint() {
  if (answered) return;
  
  if (hintsUsed >= maxHints) {
    showResult(false, null);
    return;
  }
  
  const hintText = getNextHint();
  if (!hintText) return;
  
  hintsUsed++;
  currentHints.push(hintText);
  
  const hintDisplay = document.getElementById('hintDisplay');
  const hintItems = document.getElementById('hintItems');
  
  hintDisplay.classList.add('show');
  hintItems.innerHTML = currentHints.map(h => 
    `<div class="hint-item">${h}</div>`
  ).join('');
  
  const hintBtn = document.getElementById('hintBtn');
  const remaining = maxHints - hintsUsed;
  if (remaining > 0) {
    document.getElementById('hintCount').textContent = remaining;
  } else {
    hintBtn.innerHTML = '答えを見る';
    hintBtn.classList.add('reveal-mode');
  }
}

// Add to history
function addToHistory(isCorrect, userAnswer) {
  if (isCorrect && hintsUsed === 0) return;
  
  historyList.unshift({
    headTail: currentHeadTail.first + '→' + currentHeadTail.last,
    answerCount: currentHeadTail.stations.length,
    userAnswer: userAnswer,
    isCorrect: isCorrect,
    hintsUsed: hintsUsed,
    hints: [...currentHints],
    sampleStation: hintAnswerStation
  });
  
  if (historyList.length > 30) {
    historyList = historyList.slice(0, 30);
  }
  
  renderHistory();
  updateWrongNoteCount();
}

// Render history list
function renderHistory() {
  const historyEl = document.getElementById('historyList');
  
  if (historyList.length === 0) {
    historyEl.innerHTML = '<div class="history-empty">まだ履歴はありません</div>';
    return;
  }
  
  historyEl.innerHTML = historyList.map((item, idx) => {
    const statusClass = item.isCorrect ? '' : 'wrong';
    const hintClass = item.hintsUsed > 0 && item.isCorrect ? 'hint-used' : '';
    const icon = item.isCorrect ? (item.hintsUsed > 0 ? '💡' : '✅') : '❌';
    
    let tags = `<span class="history-tag">${item.headTail}</span>`;
    tags += `<span class="history-tag line-tag">全${item.answerCount}駅</span>`;
    if (item.hintsUsed > 0) {
      tags += `<span class="history-tag hint-tag">ヒント×${item.hintsUsed}</span>`;
    }
    
    const answerText = item.userAnswer 
      ? `あなたの答え: ${item.userAnswer}` 
      : 'スキップ';
    
    return `
      <div class="history-item ${statusClass} ${hintClass}">
        <div class="history-icon">${icon}</div>
        <div class="history-content">
          <div class="history-station">${item.sampleStation.kanji}（${item.sampleStation.kana}）</div>
          <div class="history-kana">${answerText}</div>
          <div class="history-meta">
            ${tags}
          </div>
          ${item.hints.length > 0 ? `
            <div style="margin-top:6px; font-size:0.8rem; color:#f0c060;">
              ${item.hints.map((h, i) => `💡 ${h}`).join('<br>')}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// Render the kana display
function renderKanaDisplay() {
  const display = document.getElementById('kanaDisplay');
  const firstKana = currentHeadTail.first;
  const lastKana = currentHeadTail.last;
  
  let html = `
    <div class="kana-box kana-first">
      <span class="label">最初の文字</span>
      ${firstKana}
    </div>
    <div class="arrow">→</div>
  `;
  
  if (currentMode === 'hint') {
    const station = hintAnswerStation;
    if (station.kana.length > 2) {
      const middle = station.kana.slice(1, -1).split('');
      const shuffled = middle.sort(() => Math.random() - 0.5).slice(0, 2);
      shuffled.forEach((kana, i) => {
        html += `
          <div class="kana-box kana-middle">
            <span class="label">ヒント${i + 1}</span>
            ${kana}
          </div>
        `;
      });
      html += '<div class="arrow">→</div>';
    }
  }
  
  html += `
    <div class="kana-box kana-last">
      <span class="label">最後の文字</span>
      ${lastKana}
    </div>
  `;
  
  display.innerHTML = html;
  
  document.querySelectorAll('.kana-box').forEach(box => {
    box.classList.add('pulse');
    setTimeout(() => box.classList.remove('pulse'), 500);
  });
}

  const answerList = document.getElementById('answerList');
  const answerCount = document.getElementById('answerCount');
  const userAnswerInfo = document.getElementById('userAnswerInfo');
  
  // List all matching stations
  const stations = currentHeadTail.stations;
  const uniqueCount = new Set(stations.map(s => s.kanji)).size;

  if (isCorrect) {
    correctCount++;
    streakCount++;
    resultArea.className = 'result-area show result-correct';
    resultIcon.textContent = '✅';
    resultText.textContent = uniqueCount > 1 ? '正解！この首尾の駅は他にもあります👇' : '正解！';
  } else {
    wrongCount++;
    streakCount = 0;
    resultArea.className = 'result-area show result-wrong';
    resultIcon.textContent = '❌';
    resultText.textContent = userAnswer ? '残念、不正解... 正解は👇' : '正解は👇';
  }
  
  totalQuestions++;
  
  // Show user answer if provided and wrong
  if (userAnswer && !isCorrect) {
    userAnswerInfo.style.display = 'flex';
    document.getElementById('userKanji').textContent = userAnswer;
    document.getElementById('userKana').textContent = '';
    document.getElementById('userLine').textContent = 'あなたの答え';
  } else {
    userAnswerInfo.style.display = 'none';
  }
  
  answerCount.textContent = uniqueCount;
  
  // Group by kanji (unique stations)
  const uniqueByKanji = {};
  stations.forEach(s => {
    if (!uniqueByKanji[s.kanji]) {
      uniqueByKanji[s.kanji] = { kanji: s.kanji, kana: s.kana, lines: [] };
    }
    if (!uniqueByKanji[s.kanji].lines.includes(s.line)) {
      uniqueByKanji[s.kanji].lines.push(s.line);
    }
  });
  
  answerList.innerHTML = Object.values(uniqueByKanji).map(s => `
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 8px;">
      <div>
        <span style="font-weight: bold; font-size: 0.95rem;">${s.kanji}</span>
        <span style="color: #a0a0c0; font-size: 0.85rem; margin-left: 6px;">（${s.kana}）</span>
      </div>
      <div style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end;">
        ${s.lines.map(l => `<span class="history-tag line-tag clickable-line" onclick="showLineModal('${l}')">${l} ↗</span>`).join('')}
      </div>
    </div>
  `).join('');
  
  updateScore();
  updateProgress();
  addToHistory(isCorrect, userAnswer);
}

// Update score display
function updateScore() {
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('streakCount').textContent = streakCount;
}

// Update progress bar
function updateProgress() {
  const filtered = getFilteredStations();
  const groups = buildHeadTailGroups(filtered);
  const total = Object.keys(groups).length;
  const current = usedHeadTails.size;
  const progress = total > 0 ? Math.min((current / total) * 100, 100) : 0;
  document.getElementById('progressFill').style.width = progress + '%';
  
  let label = `${current} / ${total}`;
  if (wrongNoteMode) {
    label = `📝 間違えノート: ${label}`;
  }
  document.getElementById('progressText').textContent = label;
}

// Next question
function nextQuestion() {
  const ht = pickRandomHeadTail();
  if (!ht) {
    if (wrongNoteMode) {
      alert('間違えノートが空です。まずは問題を解いて、間違えた駅を溜めましょう！');
    } else {
      alert('該当する駅がありません。路線の選択を変更してください。');
    }
    return;
  }
  
  currentHeadTail = ht;
  // Pick a representative station for hint generation
  hintAnswerStation = ht.stations[Math.floor(Math.random() * ht.stations.length)];
  
  answered = false;
  hintsUsed = 0;
  currentHints = [];
  
  document.getElementById('answerInput').value = '';
  document.getElementById('resultArea').className = 'result-area';
  document.getElementById('hintSection').style.display = currentMode === 'hint' ? 'block' : 'none';
  document.getElementById('hintDisplay').classList.remove('show');
  document.getElementById('hintItems').innerHTML = '';
  
  const hintBtn = document.getElementById('hintBtn');
  hintBtn.disabled = false;
  hintBtn.classList.remove('reveal-mode');
  hintBtn.innerHTML = `ヒント<span class="hint-count" id="hintCount">${maxHints}</span>`;
  
  renderKanaDisplay();
  document.getElementById('answerInput').focus();
}

// ===== イベントハンドラ =====
document.getElementById('submitBtn').addEventListener('click', () => {
  if (answered) return;
  const input = document.getElementById('answerInput').value.trim();
  if (!input) return;
  const matched = checkAnswer(input);
  showResult(matched !== null, input);
});

document.getElementById('answerInput').addEventListener('keydown', (e) => {

    } else {

});

document.getElementById('skipBtn').addEventListener('click', () => {

});

document.getElementById('hintBtn').addEventListener('click', () => {

});

document.getElementById('historyClearBtn').addEventListener('click', () => {

// Wrong note toggle
document.getElementById('wrongNoteToggle').addEventListener('click', () => {

// Update wrong note count display
function updateWrongNoteCount() {
  const wrongKanjiSet = new Set();
  historyList.forEach(item => {
    if (item.sampleStation) {
      wrongKanjiSet.add(item.sampleStation.kanji);
    }
  });

// ===== 駅一覧ビュー =====
let currentView = 'game'; // game or list

function switchView(view) {
  currentView = view;
  const gameView = document.getElementById('gameView');
  const listView = document.getElementById('listView');
  const gameBtn = document.getElementById('viewGameBtn');
  const listBtn = document.getElementById('viewListBtn');
  
  if (view === 'game') {
    gameView.classList.remove('hide');
    listView.classList.remove('show');
    gameBtn.classList.add('active');
    listBtn.classList.remove('active');
  } else {
    gameView.classList.add('hide');
    listView.classList.add('show');
    gameBtn.classList.remove('active');
    listBtn.classList.add('active');
    renderStationList();
  }
}

document.getElementById('viewGameBtn').addEventListener('click', () => switchView('game'));
document.getElementById('viewListBtn').addEventListener('click', () => switchView('list'));

// Build stations grouped by line for list view
function buildLineStationMap() {
  const map = {};
  stationDB.forEach(s => {
    if (!map[s.line]) {
      map[s.line] = [];
    }
    // Avoid duplicates within same line
    if (!map[s.line].find(x => x.kanji === s.kanji)) {
      map[s.line].push({ kanji: s.kanji, kana: s.kana });
    }
  });
  return map;
}

// Render station list view - line list with → connected stations
function renderStationList(searchQuery = '') {
  const container = document.getElementById('slGroups');
  const indexContainer = document.getElementById('slIndex');
  const lineMap = buildLineStationMap();
  const query = searchQuery.toLowerCase().trim();
  
  // Filter groups that have content
  const visibleGroups = lineGroups.filter(group => {
    return group.lines.some(line => {
      if (!query) return true;
      if (line.toLowerCase().includes(query)) return true;
      const stations = lineMap[line] || [];
      return stations.some(s => 
        s.kanji.toLowerCase().includes(query) || 
        s.kana.toLowerCase().includes(query)
      );
    });
  });
  
  // Render index (only when not searching)
  if (!query && visibleGroups.length > 0) {
    indexContainer.style.display = 'flex';
    indexContainer.innerHTML = visibleGroups.map((g, i) => `
      <button class="sl-index-btn" onclick="document.getElementById('sl-group-${i}').scrollIntoView({behavior:'smooth',block:'start'})">
        ${g.name}
      </button>
    `).join('');
  } else {
    indexContainer.style.display = 'none';
  }
  
  let html = '';
  
  visibleGroups.forEach((group, groupIdx) => {
    const groupLines = group.lines.filter(line => {
      if (!query) return true;
      if (line.toLowerCase().includes(query)) return true;
      const stations = lineMap[line] || [];
      return stations.some(s => 
        s.kanji.toLowerCase().includes(query) || 
        s.kana.toLowerCase().includes(query)
      );
    });
    
    if (groupLines.length === 0) return;
    
    html += `<div class="sl-category-title" id="sl-group-${groupIdx}">${group.name}</div>`;
    
    groupLines.forEach(line => {
      const stations = lineMap[line] || [];
      let filteredStations = stations;
      if (query) {
        filteredStations = stations.filter(s => 
          s.kanji.toLowerCase().includes(query) || 
          s.kana.toLowerCase().includes(query)
        );
      }
      if (filteredStations.length === 0 && query) return;
      
      const stationHtml = filteredStations.map((s, i) => `
        <span class="sl-station-name">${s.kanji}<span class="sl-station-kana">${s.kana}</span></span>
        ${i < filteredStations.length - 1 ? '<span class="sl-station-arrow">→</span>' : ''}
      `).join('');
      
      html += `
        <div class="sl-line">
          <div class="sl-line-header" onclick="this.parentElement.classList.toggle('open')">
            <span>
              <span class="sl-line-name">${line}</span>
              <span class="sl-line-count">${stations.length}駅</span>
            </span>
            <span class="sl-line-toggle">▼</span>
          </div>
          <div class="sl-line-stations">
            <div class="sl-station-row">${stationHtml}</div>
          </div>
        </div>
      `;
    });
  });
  
  if (!html) {
    html = '<div style="text-align: center; color: #8080a0; padding: 40px 0;">該当する路線・駅がありません</div>';
  }
  
  container.innerHTML = html;
}

// Search
document.getElementById('slSearch').addEventListener('input', (e) => {
  renderStationList(e.target.value);
});

// ===== 路線選択モーダル =====
function openLineSelectModal() {
  const modal = document.getElementById('lineSelectModal');
  const container = document.getElementById('lsModalGroups');
  const allBtn = document.getElementById('lsSelectAll');
  
  // Build group HTML
  let html = '';
  lineGroups.forEach((group, gi) => {
    html += `
      <div class="ls-modal-group">
        <div class="ls-modal-group-title">${group.name}</div>
        <div class="ls-modal-group-btns">
          ${group.lines.map(line => {
            const isActive = selectedLines.has(line);
            return `<button class="line-btn ${isActive ? 'active' : ''}" type="button" data-line="${line}">${line}</button>`;
          }).join('')}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
  
  // Update "all" button state
  allBtn.classList.toggle('active', selectedLines.size === 0);
  
  // Event delegation
  function handleClick(e) {
    const btn = e.target.closest('.line-btn');
    if (!btn) return;
    
    const line = btn.dataset.line;
    if (line === '__all__') {
      // Select all
      selectedLines.clear();
      container.querySelectorAll('.line-btn').forEach(b => b.classList.remove('active'));
      allBtn.classList.add('active');
    } else {
      allBtn.classList.remove('active');
      if (selectedLines.has(line)) {
        selectedLines.delete(line);
        btn.classList.remove('active');
        if (selectedLines.size === 0) {
          allBtn.classList.add('active');
        }
      } else {
        selectedLines.add(line);
        btn.classList.add('active');
      }
    }
  }
  
  container.onclick = handleClick;
  allBtn.onclick = function() {
    selectedLines.clear();
    container.querySelectorAll('.line-btn').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
  };
  const clearBtn = document.getElementById('lsClearAll');
  clearBtn.onclick = function() {
    selectedLines.clear();
    container.querySelectorAll('.line-btn').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
  };
  
  modal.classList.add('show');
  
  // 背景点击关闭（在元素存在时绑定）
  modal.onclick = function(e) {
    if (e.target === modal) closeLineSelectModal();
  };
}

// 确保全局可访问（内联onclick用）
window.closeLineSelectModal = closeLineSelectModal;
window.openLineSelectModal = openLineSelectModal;

function closeLineSelectModal() {
  // 先关闭弹窗，确保一定能关闭
  const modal = document.getElementById('lineSelectModal');
  if (modal) modal.classList.remove('show');
  
  try {
    updateSelectedLineCount();
    usedHeadTails.clear();
    nextQuestion();
  } catch (e) {
    console.error('closeLineSelectModal error:', e);
  }
}

document.getElementById('lineSelectClose').addEventListener('click', closeLineSelectModal);
document.getElementById('lsModalDone').addEventListener('click', closeLineSelectModal);
document.getElementById('lineSelectModal').addEventListener('click', (e) => {
  if (e.target.id === 'lineSelectModal') closeLineSelectModal();
});

// ===== 路線モーダル =====
function showLineModal(lineName) {
  const modal = document.getElementById('lineModal');
  const title = document.getElementById('modalTitle');
  const content = document.getElementById('modalContent');
  
  const lineMap = buildLineStationMap();
  const stations = lineMap[lineName] || [];
  
  title.textContent = `${lineName}（全${stations.length}駅）`;
  
  const stationHtml = stations.map((s, i) => `
    <span class="sl-station-name">${s.kanji}<span class="sl-station-kana">${s.kana}</span></span>
    ${i < stations.length - 1 ? '<span class="sl-station-arrow">→</span>' : ''}
  `).join('');
  
  content.innerHTML = `<div class="sl-station-row">${stationHtml}</div>`;
  
  modal.classList.add('show');
}

function closeModal() {
  document.getElementById('lineModal').classList.remove('show');
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('lineModal').addEventListener('click', (e) => {
  if (e.target.id === 'lineModal') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// グローバル関数として登録（内联onclick用）
window.closeModal = closeModal;
window.showLineModal = showLineModal;

initLineFilter();
