// Get unique places (deduplicate by kana+kanji)
function getUniquePlaces() {
  const seen = new Set();
  return placeDB.filter(p => {
    const key = p.kanji + p.kana;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// Initialize prefecture filter UI
function initPrefFilter() {
  const container = document.getElementById('prefFilterGroups');
  let html = '';

  html += `
    <div class="pref-group">
      <div class="pref-group-btns">
        <button class="pref-btn all-btn active" data-pref="__all__">全都道府県</button>
      </div>
    </div>
  `;

  regionGroups.forEach(group => {
    html += `
      <div class="pref-group">
        <div class="pref-group-title">${group.name}</div>
        <div class="pref-group-btns">
          ${group.prefectures.map(pref =>
            `<button class="pref-btn" data-pref="${pref}">${pref}</button>`
          ).join('')}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;

  function handlePrefBtnClick(e) {
    const btn = e.target.closest('.pref-btn');
    if (!btn) return;

    const pref = btn.dataset.pref;

    if (pref === '__all__') {
      selectedPrefs.clear();
      container.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    } else {
      const allBtn = container.querySelector('.pref-btn.all-btn');
      allBtn.classList.remove('active');

      if (selectedPrefs.has(pref)) {
        selectedPrefs.delete(pref);
        btn.classList.remove('active');
        if (selectedPrefs.size === 0) {
          allBtn.classList.add('active');
        }
      } else {
        selectedPrefs.add(pref);
        btn.classList.add('active');
      }
    }

    updateSelectedPrefCount();
    usedHeadTails.clear();
    nextQuestion();
  }

  container.addEventListener('click', handlePrefBtnClick);
}

function updateSelectedPrefCount() {
  const countEl = document.getElementById('selectedPrefCount');
  if (selectedPrefs.size === 0) {
    countEl.textContent = '（全都道府県）';
  } else {
    countEl.textContent = `（${selectedPrefs.size}都道府県）`;
  }
}

// Get filtered places based on selected prefectures and wrong note mode
function getFilteredPlaces() {
  let filtered = placeDB.slice();

  // Wrong note mode: use places from history
  if (wrongNoteMode) {
    const wrongKanjiSet = new Set();
    historyList.forEach(item => {
      if (item.samplePlace) {
        wrongKanjiSet.add(item.samplePlace.kanji);
      }
    });
    filtered = filtered.filter(p => wrongKanjiSet.has(p.kanji));
  } else if (selectedPrefs.size > 0) {
    filtered = filtered.filter(p => selectedPrefs.has(p.prefecture));
  }

  // Deduplicate
  const seen = new Set();
  filtered = filtered.filter(p => {
    const key = p.kanji + p.kana;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  return filtered;
}

// Build head-tail groups from filtered places
function buildHeadTailGroups(places) {
  const groups = {};
  places.forEach(p => {
    const first = p.kana[0];
    const last = p.kana[p.kana.length - 1];
    const key = first + '→' + last;
    if (!groups[key]) {
      groups[key] = { first, last, places: [] };
    }
    groups[key].places.push(p);
  });
  return groups;
}

// Pick a random head-tail combination
function pickRandomHeadTail() {
  const filtered = getFilteredPlaces();
  const groups = buildHeadTailGroups(filtered);
  const groupKeys = Object.keys(groups);

  if (groupKeys.length === 0) return null;

  if (usedHeadTails.size >= groupKeys.length) {
    usedHeadTails.clear();
  }

  const unusedKeys = groupKeys.filter(k => !usedHeadTails.has(k));
  const key = unusedKeys[Math.floor(Math.random() * unusedKeys.length)];

  usedHeadTails.add(key);
  return groups[key];
}

// Find all places matching head and tail kana
function findMatchingPlaces(firstKana, lastKana) {
  return getFilteredPlaces().filter(p =>
    p.kana[0] === firstKana && p.kana[p.kana.length - 1] === lastKana
  );
}

// Check if user input matches any place with current head-tail
function checkAnswer(userInput) {
  const normalized = userInput.trim().toLowerCase();
  const places = currentHeadTail.places;

  const matched = places.find(p =>
    normalized === p.kana || normalized === p.kanji
  );

  return matched || null;
}

// Get hint content based on hint level
function getNextHint() {
  const place = hintAnswerPlace;
  const kana = place.kana;
  const prefecture = place.prefecture;

  let availableMiddleChars = [];
  if (kana.length > 2) {
    availableMiddleChars = kana.slice(1, -1).split('');
  }

  const usedMiddleChars = currentHints
    .map(h => {
      const m = h.match(/途中に「(.)」/);
      return m ? m[1] : null;
    })
    .filter(c => c !== null);

  const remainingMiddle = availableMiddleChars.filter(c => !usedMiddleChars.includes(c));

  switch (hintsUsed) {
    case 0:
      return `文字数は ${kana.length} 文字です`;
    case 1:
      if (remainingMiddle.length > 0) {
        const char = remainingMiddle[Math.floor(Math.random() * remainingMiddle.length)];
        return `途中に「${char}」が含まれます`;
      }
      return `都道府県は「${prefecture}」です`;
    case 2:
      if (remainingMiddle.length > 1) {
        const others = remainingMiddle.filter(c => !usedMiddleChars.includes(c));
        const char = others[Math.floor(Math.random() * others.length)];
        return `途中に「${char}」も含まれます`;
      }
      return `都道府県は「${prefecture}」です`;
    default:
      return null;
  }
}

// Use a hint
function useHint() {
  if (answered) return;

  if (hintsUsed >= maxHints) {
    showResult(false, null);
    return;
  }

  const hintText = getNextHint();
  if (!hintText) return;

  hintsUsed++;
  currentHints.push(hintText);

  const hintDisplay = document.getElementById('hintDisplay');
  const hintItems = document.getElementById('hintItems');

  hintDisplay.classList.add('show');
  hintItems.innerHTML = currentHints.map(h =>
    `<div class="hint-item">${h}</div>`
  ).join('');

  const hintBtn = document.getElementById('hintBtn');
  const remaining = maxHints - hintsUsed;
  if (remaining > 0) {
    document.getElementById('hintCount').textContent = remaining;
  } else {
    hintBtn.innerHTML = '答えを見る';
    hintBtn.classList.add('reveal-mode');
  }
}

// Add to history
function addToHistory(isCorrect, userAnswer) {
  if (isCorrect && hintsUsed === 0) return;

  historyList.unshift({
    headTail: currentHeadTail.first + '→' + currentHeadTail.last,
    answerCount: currentHeadTail.places.length,
    userAnswer: userAnswer,
    isCorrect: isCorrect,
    hintsUsed: hintsUsed,
    hints: [...currentHints],
    samplePlace: hintAnswerPlace
  });

  if (historyList.length > 30) {
    historyList = historyList.slice(0, 30);
  }

  renderHistory();
  updateWrongNoteCount();
}

// Render history list
function renderHistory() {
  const historyEl = document.getElementById('historyList');

  if (historyList.length === 0) {
    historyEl.innerHTML = '<div class="history-empty">まだ履歴はありません</div>';
    return;
  }

  historyEl.innerHTML = historyList.map((item, idx) => {
    const statusClass = item.isCorrect ? '' : 'wrong';
    const hintClass = item.hintsUsed > 0 && item.isCorrect ? 'hint-used' : '';
    const icon = item.isCorrect ? (item.hintsUsed > 0 ? '💡' : '✅') : '❌';

    let tags = `<span class="history-tag">${item.headTail}</span>`;
    tags += `<span class="history-tag pref-tag">全${item.answerCount}都市</span>`;
    if (item.hintsUsed > 0) {
      tags += `<span class="history-tag hint-tag">ヒント×${item.hintsUsed}</span>`;
    }

    const answerText = item.userAnswer
      ? `あなたの答え: ${item.userAnswer}`
      : 'スキップ';

    return `
      <div class="history-item ${statusClass} ${hintClass}">
        <div class="history-icon">${icon}</div>
        <div class="history-content">
          <div class="history-place">${item.samplePlace.kanji}（${item.samplePlace.kana}）</div>
          <div class="history-kana">${answerText}</div>
          <div class="history-meta">
            ${tags}
          </div>
          ${item.hints.length > 0 ? `
            <div style="margin-top:6px; font-size:0.8rem; color:#f0c060;">
              ${item.hints.map((h, i) => `💡 ${h}`).join('<br>')}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// Render the kana display
function renderKanaDisplay() {
  const display = document.getElementById('kanaDisplay');
  const firstKana = currentHeadTail.first;
  const lastKana = currentHeadTail.last;

  let html = `
    <div class="kana-box kana-first">
      <span class="label">最初の文字</span>
      ${firstKana}
    </div>
    <div class="arrow">→</div>
  `;

  if (currentMode === 'hint') {
    const place = hintAnswerPlace;
    if (place.kana.length > 2) {
      const middle = place.kana.slice(1, -1).split('');
      const shuffled = middle.sort(() => Math.random() - 0.5).slice(0, 2);
      shuffled.forEach((kana, i) => {
        html += `
          <div class="kana-box kana-middle">
            <span class="label">ヒント${i + 1}</span>
            ${kana}
          </div>
        `;
      });
      html += '<div class="arrow">→</div>';
    }
  }

  html += `
    <div class="kana-box kana-last">
      <span class="label">最後の文字</span>
      ${lastKana}
    </div>
  `;

  display.innerHTML = html;

  document.querySelectorAll('.kana-box').forEach(box => {
    box.classList.add('pulse');
    setTimeout(() => box.classList.remove('pulse'), 500);
  });
}

// Show result
function showResult(isCorrect, userAnswer) {
  answered = true;
  const resultArea = document.getElementById('resultArea');
  const resultIcon = document.getElementById('resultIcon');
  const resultText = document.getElementById('resultText');
  const answerList = document.getElementById('answerList');
  const answerCount = document.getElementById('answerCount');
  const userAnswerInfo = document.getElementById('userAnswerInfo');

  const places = currentHeadTail.places;
  const uniqueCount = new Set(places.map(p => p.kanji)).size;

  if (isCorrect) {
    correctCount++;
    streakCount++;
    resultArea.className = 'result-area show result-correct';
    resultIcon.textContent = '✅';
    resultText.textContent = uniqueCount > 1 ? '正解！この首尾の都市は他にもあります👇' : '正解！';
  } else {
    wrongCount++;
    streakCount = 0;
    resultArea.className = 'result-area show result-wrong';
    resultIcon.textContent = '❌';
    resultText.textContent = userAnswer ? '残念、不正解... 正解は👇' : '正解は👇';
  }

  totalQuestions++;

  if (userAnswer && !isCorrect) {
    userAnswerInfo.style.display = 'flex';
    document.getElementById('userKanji').textContent = userAnswer;
    document.getElementById('userKana').textContent = '';
    document.getElementById('userPref').textContent = 'あなたの答え';
  } else {
    userAnswerInfo.style.display = 'none';
  }

  answerCount.textContent = uniqueCount;

  // Group by kanji
  const uniqueByKanji = {};
  places.forEach(p => {
    if (!uniqueByKanji[p.kanji]) {
      uniqueByKanji[p.kanji] = { kanji: p.kanji, kana: p.kana, prefs: [] };
    }
    if (!uniqueByKanji[p.kanji].prefs.includes(p.prefecture)) {
      uniqueByKanji[p.kanji].prefs.push(p.prefecture);
    }
  });

  answerList.innerHTML = Object.values(uniqueByKanji).map(p => `
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 8px;">
      <div>
        <span style="font-weight: bold; font-size: 0.95rem;">${p.kanji}</span>
        <span style="color: #a0a0c0; font-size: 0.85rem; margin-left: 6px;">（${p.kana}）</span>
      </div>
      <div style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end;">
        ${p.prefs.map(pr => `<span class="history-tag pref-tag clickable-pref" onclick="showPrefModal('${pr}')">${pr} ↗</span>`).join('')}
      </div>
    </div>
  `).join('');

  updateScore();
  updateProgress();
  addToHistory(isCorrect, userAnswer);
}

// Update score display
function updateScore() {
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('streakCount').textContent = streakCount;
}

// Update progress bar
function updateProgress() {
  const filtered = getFilteredPlaces();
  const groups = buildHeadTailGroups(filtered);
  const total = Object.keys(groups).length;
  const current = usedHeadTails.size;
  const progress = total > 0 ? Math.min((current / total) * 100, 100) : 0;
  document.getElementById('progressFill').style.width = progress + '%';

  let label = `${current} / ${total}`;
  if (wrongNoteMode) {
    label = `📝 間違えノート: ${label}`;
  }
  document.getElementById('progressText').textContent = label;
}

// Next question
function nextQuestion() {
  const ht = pickRandomHeadTail();
  if (!ht) {
    if (wrongNoteMode) {
      alert('間違えノートが空です。まずは問題を解いて、間違えた都市を溜めましょう！');
    } else {
      alert('該当する都市がありません。都道府県の選択を変更してください。');
    }
    return;
  }

  currentHeadTail = ht;
  hintAnswerPlace = ht.places[Math.floor(Math.random() * ht.places.length)];

  answered = false;
  hintsUsed = 0;
  currentHints = [];

  document.getElementById('answerInput').value = '';
  document.getElementById('resultArea').className = 'result-area';
  document.getElementById('hintSection').style.display = currentMode === 'hint' ? 'block' : 'none';
  document.getElementById('hintDisplay').classList.remove('show');
  document.getElementById('hintItems').innerHTML = '';

  const hintBtn = document.getElementById('hintBtn');
  hintBtn.disabled = false;
  hintBtn.classList.remove('reveal-mode');
  hintBtn.innerHTML = `ヒント<span class="hint-count" id="hintCount">${maxHints}</span>`;

  renderKanaDisplay();
  document.getElementById('answerInput').focus();
}

// ===== イベントハンドラ =====
document.getElementById('submitBtn').addEventListener('click', () => {
  if (answered) return;
  const input = document.getElementById('answerInput').value.trim();
  if (!input) return;
  const matched = checkAnswer(input);
  showResult(matched !== null, input);
});

document.getElementById('answerInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (answered) {
      nextQuestion();
    } else {
      const input = e.target.value.trim();
      if (input) {
        const matched = checkAnswer(input);
        showResult(matched !== null, input);
      }
    }
  }
});

document.getElementById('skipBtn').addEventListener('click', () => {
  if (answered) return;
  showResult(false, null);
});

document.getElementById('hintBtn').addEventListener('click', () => {
  useHint();
});

document.getElementById('historyClearBtn').addEventListener('click', () => {
  if (historyList.length === 0) return;
  if (confirm('履歴をクリアしますか？')) {
    historyList = [];
    renderHistory();
  }
});

document.getElementById('nextBtn').addEventListener('click', nextQuestion);

// Mode selector
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    usedHeadTails.clear();
    nextQuestion();
  });
});

// Wrong note toggle
document.getElementById('wrongNoteToggle').addEventListener('click', () => {
  wrongNoteMode = !wrongNoteMode;
  const btn = document.getElementById('wrongNoteToggle');
  const prefFilter = document.getElementById('prefFilter');

  if (wrongNoteMode) {
    btn.classList.add('active');
    prefFilter.style.opacity = '0.4';
    prefFilter.style.pointerEvents = 'none';
  } else {
    btn.classList.remove('active');
    prefFilter.style.opacity = '1';
    prefFilter.style.pointerEvents = 'auto';
  }

  usedHeadTails.clear();
  nextQuestion();
});

// Update wrong note count display
function updateWrongNoteCount() {
  const wrongKanjiSet = new Set();
  historyList.forEach(item => {
    if (item.samplePlace) {
      wrongKanjiSet.add(item.samplePlace.kanji);
    }
  });
  document.getElementById('wrongNoteCount').textContent = wrongKanjiSet.size;
}

// ===== 都市一覧ビュー =====
let currentView = 'game'; // game or list

function switchView(view) {
  currentView = view;
  const gameView = document.getElementById('gameView');
  const listView = document.getElementById('listView');
  const gameBtn = document.getElementById('viewGameBtn');
  const listBtn = document.getElementById('viewListBtn');

  if (view === 'game') {
    gameView.classList.remove('hide');
    listView.classList.remove('show');
    gameBtn.classList.add('active');
    listBtn.classList.remove('active');
  } else {
    gameView.classList.add('hide');
    listView.classList.add('show');
    gameBtn.classList.remove('active');
    listBtn.classList.add('active');
    renderPlaceList();
  }
}

document.getElementById('viewGameBtn').addEventListener('click', () => switchView('game'));
document.getElementById('viewListBtn').addEventListener('click', () => switchView('list'));

// Build places grouped by prefecture for list view
function buildPrefPlaceMap() {
  const map = {};
  placeDB.forEach(p => {
    if (!map[p.prefecture]) {
      map[p.prefecture] = [];
    }
    if (!map[p.prefecture].find(x => x.kanji === p.kanji)) {
      map[p.prefecture].push({ kanji: p.kanji, kana: p.kana });
    }
  });
  return map;
}

// Render place list view - region > prefecture > cities with → connected
function renderPlaceList(searchQuery = '') {
  const container = document.getElementById('slGroups');
  const indexContainer = document.getElementById('slIndex');
  const prefMap = buildPrefPlaceMap();
  const query = searchQuery.toLowerCase().trim();

  // Filter groups that have content
  const visibleGroups = regionGroups.filter(group => {
    return group.prefectures.some(pref => {
      if (!query) return true;
      if (pref.toLowerCase().includes(query)) return true;
      const places = prefMap[pref] || [];
      return places.some(p =>
        p.kanji.toLowerCase().includes(query) ||
        p.kana.toLowerCase().includes(query)
      );
    });
  });

  // Render index (only when not searching)
  if (!query && visibleGroups.length > 0) {
    indexContainer.style.display = 'flex';
    indexContainer.innerHTML = visibleGroups.map((g, i) => `
      <button class="sl-index-btn" onclick="document.getElementById('sl-group-${i}').scrollIntoView({behavior:'smooth',block:'start'})">
        ${g.name}
      </button>
    `).join('');
  } else {
    indexContainer.style.display = 'none';
  }

  let html = '';

  visibleGroups.forEach((group, groupIdx) => {
    const groupPrefs = group.prefectures.filter(pref => {
      if (!query) return true;
      if (pref.toLowerCase().includes(query)) return true;
      const places = prefMap[pref] || [];
      return places.some(p =>
        p.kanji.toLowerCase().includes(query) ||
        p.kana.toLowerCase().includes(query)
      );
    });

    if (groupPrefs.length === 0) return;

    html += `<div class="sl-category-title" id="sl-group-${groupIdx}">${group.name}</div>`;

    groupPrefs.forEach(pref => {
      const places = prefMap[pref] || [];
      let filteredPlaces = places;
      if (query) {
        filteredPlaces = places.filter(p =>
          p.kanji.toLowerCase().includes(query) ||
          p.kana.toLowerCase().includes(query)
        );
      }
      if (filteredPlaces.length === 0 && query) return;

      const placeHtml = filteredPlaces.map((s, i) => `
        <span class="sl-place-name">${s.kanji}<span class="sl-place-kana">${s.kana}</span></span>
        ${i < filteredPlaces.length - 1 ? '<span class="sl-place-arrow">→</span>' : ''}
      `).join('');

      html += `
        <div class="sl-pref">
          <div class="sl-pref-header" onclick="this.parentElement.classList.toggle('open')">
            <span>
              <span class="sl-pref-name">${pref}</span>
              <span class="sl-pref-count">${places.length}都市</span>
            </span>
            <span class="sl-pref-toggle">▼</span>
          </div>
          <div class="sl-pref-places">
            <div class="sl-place-row">${placeHtml}</div>
          </div>
        </div>
      `;
    });
  });

  if (!html) {
    html = '<div style="text-align: center; color: #8080a0; padding: 40px 0;">該当する都道府県・都市がありません</div>';
  }

  container.innerHTML = html;
}

// Search
document.getElementById('slSearch').addEventListener('input', (e) => {
  renderPlaceList(e.target.value);
});

// ===== 都道府県選択モーダル =====
function openPrefSelectModal() {
  const modal = document.getElementById('prefSelectModal');
  const container = document.getElementById('psModalGroups');
  const allBtn = document.getElementById('psSelectAll');

  let html = '';
  regionGroups.forEach((group, gi) => {
    html += `
      <div class="ps-modal-group">
        <div class="ps-modal-group-title">${group.name}</div>
        <div class="ps-modal-group-btns">
          ${group.prefectures.map(pref => {
            const isActive = selectedPrefs.has(pref);
            return `<button class="pref-btn ${isActive ? 'active' : ''}" type="button" data-pref="${pref}">${pref}</button>`;
          }).join('')}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;

  allBtn.classList.toggle('active', selectedPrefs.size === 0);

  function handleClick(e) {
    const btn = e.target.closest('.pref-btn');
    if (!btn) return;

    const pref = btn.dataset.pref;
    if (pref === '__all__') {
      selectedPrefs.clear();
      container.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
      allBtn.classList.add('active');
    } else {
      allBtn.classList.remove('active');

      if (selectedPrefs.has(pref)) {
        selectedPrefs.delete(pref);
        btn.classList.remove('active');
        if (selectedPrefs.size === 0) {
          allBtn.classList.add('active');
        }
      } else {
        selectedPrefs.add(pref);
        btn.classList.add('active');
      }
    }
  }

  container.onclick = handleClick;
  allBtn.onclick = function() {
    selectedPrefs.clear();
    container.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
  };
  const clearBtn = document.getElementById('psClearAll');
  clearBtn.onclick = function() {
    selectedPrefs.clear();
    container.querySelectorAll('.pref-btn').forEach(b => b.classList.remove('active'));
    allBtn.classList.add('active');
  };

  modal.classList.add('show');

  modal.onclick = function(e) {
    if (e.target === modal) closePrefSelectModal();
  };
}

// グローバル関数として登録（内联onclick用）
window.closePrefSelectModal = closePrefSelectModal;
window.openPrefSelectModal = openPrefSelectModal;

function closePrefSelectModal() {
  const modal = document.getElementById('prefSelectModal');
  if (modal) modal.classList.remove('show');

  try {
    updateSelectedPrefCount();
    usedHeadTails.clear();
    nextQuestion();
  } catch (e) {
    console.error('closePrefSelectModal error:', e);
  }
}

document.getElementById('prefSelectClose').addEventListener('click', closePrefSelectModal);
document.getElementById('psModalDone').addEventListener('click', closePrefSelectModal);
document.getElementById('prefSelectModal').addEventListener('click', (e) => {
  if (e.target.id === 'prefSelectModal') closePrefSelectModal();
});

// ===== 都道府県モーダル =====
function showPrefModal(prefName) {
  const modal = document.getElementById('prefModal');
  const title = document.getElementById('prefModalTitle');
  const content = document.getElementById('prefModalContent');

  const prefMap = buildPrefPlaceMap();
  const places = prefMap[prefName] || [];

  title.textContent = `${prefName}（全${places.length}都市）`;

  const placeHtml = places.map((s, i) => `
    <span class="sl-place-name">${s.kanji}<span class="sl-place-kana">${s.kana}</span></span>
    ${i < places.length - 1 ? '<span class="sl-place-arrow">→</span>' : ''}
  `).join('');

  content.innerHTML = `<div class="sl-place-row">${placeHtml}</div>`;

  modal.classList.add('show');
}

function closePrefModal() {
  document.getElementById('prefModal').classList.remove('show');
}

document.getElementById('prefModalClose').addEventListener('click', closePrefModal);
document.getElementById('prefModal').addEventListener('click', (e) => {
  if (e.target.id === 'prefModal') closePrefModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePrefModal();
});

// グローバル関数として登録（内联onclick用）
window.closePrefModal = closePrefModal;
window.showPrefModal = showPrefModal;

// ===== ゲーム開始 =====
initPrefFilter();
updateWrongNoteCount();
nextQuestion();

(function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('view') === 'list') {
    switchView('list');
  }
})();
