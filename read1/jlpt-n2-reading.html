<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N2 阅读理解</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Yu Gothic", "Noto Sans CJK JP", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; line-height: 1.8; }
  .container { max-width: 960px; margin: 0 auto; }
  header { text-align: center; color: white; margin-bottom: 30px; padding: 30px 20px; }
  header h1 { font-size: 2.2em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  header p { font-size: 1.1em; opacity: 0.9; }

  .page { display: none; background: white; border-radius: 12px; padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 25px; }
  .page.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .index-item { padding: 12px 15px; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 8px;
    cursor: pointer; transition: all 0.2s; font-size: 0.92em; color: #4a5568; text-align: left; }
  .index-item:hover { background: #edf2f7; border-color: #667eea; transform: translateY(-2px); }
  .index-item.done { border-color: #48bb78; background: #f0fff4; color: #22543d; }

  .passage-header { border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
  .passage-title { font-size: 1.3em; font-weight: bold; color: #2d3748; }
  .passage-meta { font-size: 0.85em; color: #a0aec0; margin-top: 4px; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold; color: white; margin-left: 8px; }
  .badge-compare { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
  .badge-search { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }

  .article-a, .article-b { background: #f7fafc; border-radius: 10px; padding: 18px 22px; margin-bottom: 18px; }
  .article-a { border-left: 5px solid #f5576c; }
  .article-b { border-left: 5px solid #4facfe; }
  .article-label { font-weight: bold; font-size: 1.05em; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px dashed #cbd5e0; }
  .article-a .article-label { color: #f5576c; }
  .article-b .article-label { color: #4facfe; }
  .article-body { color: #2d3748; font-size: 0.98em; text-align: justify; }

  .search-article { background: #fffaf0; border: 2px dashed #ed8936; border-radius: 10px; padding: 20px 25px; margin-bottom: 20px; }
  .search-article h4 { color: #c05621; margin-bottom: 12px; font-size: 1.15em; }
  .info-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  .info-table th, .info-table td { padding: 8px 12px; border: 1px solid #fbd38d; text-align: left; }
  .info-table th { background: #feebc8; color: #c05621; width: 30%; font-weight: bold; }
  .highlight { background: #fefcbf; padding: 2px 6px; border-radius: 3px; }

  .question { background: #edf2f7; border-radius: 10px; padding: 18px 22px; margin-bottom: 15px; }
  .question-text { font-size: 1.05em; font-weight: bold; color: #2d3748; margin-bottom: 12px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option { padding: 12px 18px; background: white; border: 2px solid #e2e8f0; border-radius: 8px;
    cursor: pointer; transition: all 0.2s; font-size: 0.95em; }
  .option:hover { border-color: #667eea; background: #ebf4ff; }
  .option.selected { border-color: #667eea; background: #667eea; color: white; }
  .option.correct { border-color: #48bb78; background: #48bb78; color: white; }
  .option.wrong { border-color: #f56565; background: #fed7d7; color: #c53030; }
  .option.disabled { cursor: default; }

  .answer-box { display: none; margin-top: 15px; padding: 15px 20px; border-radius: 8px; }
  .answer-box.show { display: block; animation: fadeIn 0.3s; }
  .answer-box.correct-box { background: #f0fff4; border: 2px solid #48bb78; }
  .answer-box.wrong-box { background: #fff5f5; border: 2px solid #f56565; }
  .answer-label { font-weight: bold; margin-bottom: 8px; font-size: 1.05em; }
  .correct-box .answer-label { color: #22543d; }
  .wrong-box .answer-label { color: #c53030; }
  .explanation { color: #4a5568; font-size: 0.93em; }

  .action-buttons { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .btn { padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95em; font-weight: bold; transition: all 0.2s; }
  .btn-secondary { background: #e2e8f0; color: #4a5568; }
  .btn-secondary:hover { background: #cbd5e0; }
  .btn-nav { background: white; color: #667eea; border: 2px solid #667eea; }
  .btn-nav:hover { background: #667eea; color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .progress-bar { background: #e2e8f0; border-radius: 10px; height: 10px; overflow: hidden; margin: 15px 0; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #48bb78, #38a169); transition: width 0.4s ease; border-radius: 10px; }
  .score-display { text-align: center; padding: 20px; font-size: 1.1em; color: #4a5568; }
  .score-highlight { font-size: 1.4em; font-weight: bold; color: #667eea; }
  .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 2px solid #e2e8f0; }

  .toc-section { margin-bottom: 30px; }
  .toc-section h2 { color: #2d3748; font-size: 1.3em; margin-bottom: 15px; padding-left: 10px; border-left: 4px solid #667eea; }
  .toc-section p { color: #718096; font-size: 0.9em; margin-bottom: 15px; }

  @media (max-width: 640px) {
    .page { padding: 20px 15px; }
    header h1 { font-size: 1.6em; }
    .index-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>JLPT N2 阅读理解</h1>
    <p>比較読解 &amp; 情報検索読解 · 各10篇 · 全20篇40問</p>
  </header>

  <!-- 目录页 -->
  <div class="page active" id="page-cover">
    <div style="border-bottom:2px solid #e2e8f0;padding-bottom:15px;margin-bottom:20px;">
      <div class="passage-title">📖 目次 · Index</div>
    </div>
    <p style="color:#4a5568;margin-bottom:20px;font-size:0.95em;">
      点击下方卡片开始练习，完成后可查看答案和解析。
    </p>
    <div class="toc-section">
      <h2>🔴 比較読解（对比题）</h2>
      <p>问题1：Aの内容 / 問題2：AもBも〜（2选项）＋ Aは〜、Bは〜（2选项）</p>
      <div class="index-grid" id="toc-compare"></div>
    </div>
    <div class="toc-section">
      <h2>🔵 情報検索読解（检索题）</h2>
      <p>広告・案内・募集などの実用文書から情報を検索</p>
      <div class="index-grid" id="toc-search"></div>
    </div>
    <div class="score-display">
      <div>本次练习进度</div>
      <div class="progress-bar"><div class="progress-fill" id="overall-progress" style="width:0%"></div></div>
      <div><span class="score-highlight" id="score-text">0</span> / <span id="total-text">0</span> 题正确</div>
    </div>
  </div>

  <!-- 文章页容器，JS动态填充 -->
  <div id="passages"></div>
</div>

<script>
/* ========== 题库 ========== */
const PASSAGES = [
  { type:'compare',id:'c1',title:'オンライン講座と通学講座',meta:'比較読解 第1篇',tagA:'Aさんの意見',tagB:'Bさんの意見',
    articleA:`私はオンライン講座の方が良いと思います。理由は三つあります。一つ目は、時間の融通がきくことです。朝早く起きる必要もなければ、夜遅くまで授業を受けることもできます。仕事やアルバイトと両立しやすいです。二つ目は、場所を選ばないことです。三つ目は、繰り返し視聴できることです。費用も通学講座より安いことが多いです。`,
    articleB:`私は通学講座の方が良いと思います。理由は二つあります。一つ目は、先生や他の受講生と直接会えることです。授業の後に分からないことを質問したり、クラスメートと情報交換したりできます。二つ目は、集中しやすい環境です。私はオンライン講座を一度受けましたが、途中で寝てしまったことが何度かあります。`,
    questions:[
      { q:'Aさんがオンライン講座の利点として挙げていないものはどれか？',
        options:['時間の融通がきくこと','場所を選ばないこと','先生に直接質問できること','繰り返し視聴できること'],
        answer:2, explain:'「先生に直接質問できること」はBさんが通学講座の利点として挙げたもので、Aさんの文章にはありません。' },
      { q:'AとBの関係について正しいものはどれか？',
        options:[
          'AもBも、自分の好きな講座形式に一長一短があると認めている',
          'AもBも、費用の安い講座が良いと思っている',
          'Aは先生に直接会える講座が良いと思い、Bは時間の融通がきく講座が良いと思っている',
          'Aは通学講座が良いと思い、Bはオンライン講座が良いと思っている'
        ],
        answer:0, explain:'Aさんはオンライン講座の利点を挙げ、Bさんは通学講座の利点を挙げつつも自身がオンラインで集中できなかった経験を語っています。両者とも自分の方式を好きだと主張しながらも、相手の方式にも一長一短があることを認めています。' }
    ] },
  { type:'compare',id:'c2',title:'電子書籍と紙の本',meta:'比較読解 第2篇',tagA:'Aさんの意見',tagB:'Bさんの意見',
    articleA:`私は電子書籍の方が好きです。一つの端末に何百冊も入れられるのが最大の利点です。旅行の時も荷物になりません。また、文字の大きさを変えられるのも良いです。暗い場所でも読めます。買いたい時も、ワンクリックですぐに読めます。`,
    articleB:`私はやっぱり紙の本が好きです。まず、ページをめくる感触がたまりません。また、電子書籍は充電が切れたら読めません。紙の本にはそんな心配はありません。温泉に持ち込んでも大丈夫です。本棚に並べてインテリアとしても楽しめます。`,
    questions:[
      { q:'Aさんが電子書籍の利点として挙げているのはどれか？',
        options:['インテリアとして楽しめること','ページをめくる感触が良いこと','文字の大きさを変えられること','充電の心配がないこと'],
        answer:2, explain:'Aさんは「文字の大きさを変えられる」を挙げています。他はBさんが紙の本の利点として挙げたものです。' },
      { q:'AとBの関係について正しいものはどれか？',
        options:[
          'AもBも、「持ち運び」という視点から本の形式の特徴を語っている',
          'AもBも、インテリアとして本を楽しみたいと思っている',
          'Aは充電を気にせず読める本が良いと思い、Bは文字の大きさを変えられる本が良いと思っている',
          'Aは紙の本が好きで、Bは電子書籍が好きだと言っている'
        ],
        answer:0, explain:'Aさんは電子書籍の利点として「荷物にならない」持ち運びの利便性を挙げ、Bさんは紙の本を温泉に持ち込む例を挙げるなど、両者とも「持ち運び」という視点から語っています。' }
    ] },
  { type:'compare',id:'c3',title:'リモートワークとオフィスワーク',meta:'比較読解 第3篇',tagA:'Aさんの意見',tagB:'Bさんの意見',
    articleA:`私はリモートワークが好きです。通勤時間がなくなり、その時間を読書や家事に使えるようになりました。通勤のストレスもなくなりました。服装も自由です。ただ、時々集中できないこともあります。`,
    articleB:`私はやっぱりオフィスに行って仕事をしたいです。リモートだと同僚との会話が減ってしまいました。また、リモートだとオンとオフの切り替えが難しいです。仕事が終わっても家にいるので、いつまでもPCの前に座ってしまいます。`,
    questions:[
      { q:'Aさんがリモートワークの利点として挙げているのはどれか？',
        options:['同僚との雑談ができること','生活リズムが整うこと','通勤時間がなくなること','仕事のオンオフを切り替えやすいこと'],
        answer:2, explain:'Aさんは「通勤時間がなくなった」「通勤のストレスがなくなった」を挙げています。' },
      { q:'AとBの関係について正しいものはどれか？',
        options:[
          'AもBも、リモートワークには「集中・切り替え」の面で難しさがあると感じている',
          'AもBも、通勤のストレスがなくなって良かったと思っている',
          'Aはオフィスで同僚と話すのが好きで、Bは通勤がない方が良いと思っている',
          'Aはリモートワークが嫌いで、Bはリモートワークが大好きだと言っている'
        ],
        answer:0, explain:'Aさんは「時々集中できない」とリモートの欠点を挙げ、Bさんは「リモートだとオンとオフの切り替えが難しい」と同じく自宅で仕事をする際の集中力や切り替えの問題に触れています。' }
    ] },
  { type:'compare',id:'c4',title:'太陽光発電と原子力発電',meta:'比較読解 第4篇',tagA:'Aさんの意見',tagB:'Bさんの意見',
    articleA:`太陽光発電は素晴らしいと思います。まず、環境に優しいです。二酸化炭素を排出しないし、枯渇する心配もありません。原子力発電は廃棄物の処理問題がありますが、太陽光にはそれがありません。個人でも発電できます。`,
    articleB:`私は原子力発電を止めるべきではないと考えています。まず、発電コストが安いです。太陽光発電は天気に左右されるし、夜は発電できません。また、二酸化炭素の排出量は、原子力発電も太陽光発電も同じくらい少ないです。問題は廃棄物の処理です。`,
    questions:[
      { q:'Aさんが太陽光発電の利点として挙げているのはどれか？',
        options:['発電コストが安いこと','天気に左右されないこと','個人でも発電できること','二酸化炭素を多く排出すること'],
        answer:2, explain:'Aさんは「個人でも発電できます」を挙げています。' },
      { q:'AとBの関係について正しいものはどれか？',
        options:[
          'AもBも、二酸化炭素排出量の少なさが発電方式の重要な利点だと認識している',
          'AもBも、原子力発電には廃棄物処理という問題があると言及している',
          'Aは安定供給できる発電が良いと思い、Bは環境に優しい発電が良いと思っている',
          'Aは原子力発電を支持し、Bは太陽光発電を支持している'
        ],
        answer:1, explain:'Aさんは「原子力発電は廃棄物の処理問題があります」と述べ、Bさんも「問題は廃棄物の処理です」と同じ点に触れています。両者とも原子力発電の廃棄物処理問題に言及しています。' }
    ] },
  { type:'compare',id:'c5',title:'私立学校と公立学校',meta:'比較読解 第5篇',tagA:'Aさんの意見',tagB:'Bさんの意見',
    articleA:`私立学校の方が良いと思います。まず、教育方針が明確で特色があります。教師の質が高く、少人数制のクラスが多いです。ただ、学費が高いのが難点です。`,
    articleB:`公立学校の方が良いと思います。まず、学費が安いです。誰もが平等に教育を受けられます。また、さまざまな背景の子供が集まり、視野が広がります。私立は同じような家庭の子が集まりがちですが、公立の方が良い経験になります。`,
    questions:[
      { q:'Aさんが私立学校の利点として挙げているのはどれか？',
        options:['誰もが平等に教育を受けられること','教育方針が明確で特色があること','家計に優しいこと','さまざまな背景の子供が集まること'],
        answer:1, explain:'Aさんは「教育方針が明確で特色があります」を挙げています。' },
      { q:'AとBの関係について正しいものはどれか？',
        options:[
          'AもBも、子供にどんな教育環境を提供できるかという視点で学校を比較検討している',
          'AもBも、学費の安さを最優先にしている',
          'Aは公立学校が自分に合っていると思い、Bは私立学校が自分に合っていると思っている',
          'Aは教師の質を重視し、Bは少人数制を重視している'
        ],
        answer:0, explain:'Aさんは私立の特色、教師の質、少人数制に言及し、Bさんは公立の費用や多様な環境に言及しています。両者とも「子供にどんな教育環境を提供するか」という視点から比較検討しています。' }
    ] },
  { type:'compare',id:'c6',title:'都会での生活と田舎での生活',meta:'比較読解 第6篇',tagA:'Aさんの意見',tagB:'Bさんの意見',
    articleA:`都会での生活は楽しいです。まず、仕事の機会が多いです。給料も高いです。遊ぶ場所もたくさんあります。ただ、家賃が高いのと、電車が混むのは大変です。`,
    articleB:`私は田舎での生活が大好きです。まず、自然がいっぱいです。空気もきれいです。家賃も安いです。ただ、不便な点もあります。車がないとどこにも行けないし、大きな病院に行くには時間がかかります。`,
    questions:[
      { q:'Aさんが都会での生活の利点として挙げているのはどれか？',
        options:['自然が多いこと','家賃が安いこと','仕事の機会が多く給料が高いこと','車がなくても生活できること'],
        answer:2, explain:'Aさんは「仕事の機会が多いです。給料も高いです」を挙げています。' },
      { q:'AとBの関係について正しいものはどれか？',
        options:[
          'AもBも、それぞれの生活場所において「移動」に関する何らかの不便を感じている',
          'AもBも、自然が多い場所で生活するのが好きだと言っている',
          'Aは田舎の方が仕事が多いと思い、Bは都会の方が自然が多いと思っている',
          'Aは田舎で生活したいと思い、Bは都会で生活したいと思っている'
        ],
        answer:0, explain:'Aさんは「電車が混むのは大変です」と都会の移動の不便さを挙げ、Bさんは「車がないとどこにも行けない」と田舎の移動の不便さを挙げています。両者とも「移動に不便がある」点で共通しています。' }
    ] },
  { type:'compare',id:'c7',title:'テレビCMとインターネット広告',meta:'比較読解 第7篇',tagA:'Aさんの意見',tagB:'Bさんの意見',
    articleA:`インターネット広告の方が効果があると思います。まず、ターゲットを絞れます。年齢、性別、興味関心に合わせて広告を出せます。また、効果を測定できます。ただ、インパクトのある素材作りが大切です。`,
    articleB:`私はテレビCMの力はまだまだ大きいと思います。まず、一度に多くの人に伝えられます。家族みんなで見ている番組でCMが流れれば、大きな反響があります。また、ブランドのイメージ作りに向いています。`,
    questions:[
      { q:'Aさんがインターネット広告の利点として挙げているのはどれか？',
        options:['一度に多くの人に伝えられること','ブランドの世界観を伝えられること','ターゲットを絞って効果を測定できること','親しみやすいタレントを起用できること'],
        answer:2, explain:'Aさんは「ターゲットを絞れます」「効果を測定できます」を挙げています。' },
      { q:'AとBの関係について正しいものはどれか？',
        options:[
          'AもBも、商品宣伝において「どちらの媒体も有効な手段」であるという前提で自分の好きな方を主張している',
          'AもBも、ターゲットを細かく絞って広告を出すべきだと主張している',
          'Aは多くの人に一度に伝えたいからテレビCMが良いと思い、Bはターゲットを絞りたいからネット広告が良いと思っている',
          'AはテレビCMが嫌いで、Bはインターネット広告が嫌いだと言っている'
        ],
        answer:0, explain:'Aさんはネット広告の利点を挙げつつも「インパクトのある素材作りが大切」と認め、BさんはテレビCMの利点を挙げています。両者とも「どちらも有効な手段」という前提で自分の好きな方を主張しています。' }
    ] },
  { type:'compare',id:'c8',title:'在宅介護と施設介護',meta:'比較読解 第8篇',tagA:'Aさんの意見',tagB:'Bさんの意見',

    questions:[

  { type:'search',id:'s10',title:'フィットネスクラブの会員案内',meta:'情報検索読解 第10篇',
    searchTitle:'スポーツクラブ「フィットライフ」 新規会員入会キャンペーン',
    searchContent:`<p><strong>スポーツクラブ「フィットライフ」</strong>（全国25店舗）</p><h4>2025年春の入会キャンペーン</h4>

/* ========== 状态 & 渲染 ========== */
const state = { current:'cover', answers:{}, results:{}, answered:{} };

function build() {
  const container = document.getElementById('passages');
  container.innerHTML = '';
  PASSAGES.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'page';
    div.id = 'page-' + p.id;
    const badgeClass = p.type === 'compare' ? 'badge-compare' : 'badge-search';
    const badgeText = p.type === 'compare' ? '比較読解' : '情報検索';
    let html = `<div class="passage-header">
      <div class="passage-title">${p.title}<span class="badge ${badgeClass}">${badgeText}</span></div>
      <div class="passage-meta">${p.meta}</div></div>`;
    if (p.type === 'compare') {
      html += `<div class="article-a"><div class="article-label">● ${p.tagA}</div><div class="article-body">${p.articleA.replace(/\n/g,'<br>')}</div></div>
        <div class="article-b"><div class="article-label">● ${p.tagB}</div><div class="article-body">${p.articleB.replace(/\n/g,'<br>')}</div></div>`;
    } else {
      html += `<div class="search-article">${p.searchContent}</div>`;
    }
    p.questions.forEach((q, qi) => {
      const an = state.answered[p.id] && state.answered[p.id][qi];
      const sel = state.answers[p.id] && state.answers[p.id][qi];
      const cor = state.results[p.id] && state.results[p.id][qi];
      html += `<div class="question"><div class="question-text">【問題${qi+1}】${q.q}</div><div class="options">`;
      q.options.forEach((opt, oi) => {
        let cls = 'option';
        if (an) { cls += ' disabled'; if (oi === q.answer) cls += ' correct'; else if (oi === sel) cls += ' wrong'; }
        else if (sel === oi) cls += ' selected';
        html += `<div class="${cls}">${String.fromCharCode(65+oi)}. ${opt}</div>`;
      });
      html += '</div>';
      if (an) {
        const bc = cor ? 'correct-box show' : 'wrong-box show';
        const lt = cor ? '✓ 正解！' : '✗ 不正解…正解は ' + String.fromCharCode(65 + q.answer) + ' です。';
        html += `<div class="answer-box ${bc}"><div class="answer-label">${lt}</div><div class="explanation">${q.explain}</div></div>`;
      }
      html += '</div>';
    });
    const prevId = idx > 0 ? PASSAGES[idx-1].id : null;
    const nextId = idx < PASSAGES.length - 1 ? PASSAGES[idx+1].id : null;
    html += `<div class="action-buttons">
      <button class="btn btn-secondary" onclick="resetPassage('${p.id}')">🔄 リセット</button>
      <button class="btn btn-secondary" onclick="navigateTo('cover')">📋 目次へ戻る</button></div>
      <div class="nav-buttons">
      <button class="btn btn-nav" ${!prevId?'disabled':''} onclick="${prevId?`navigateTo('${prevId}')`:''}">← 前の篇</button>
      <button class="btn btn-nav" ${!nextId?'disabled':''} onclick="${nextId?`navigateTo('${nextId}')`:''}">次の篇 →</button></div>`;
    div.innerHTML = html;
    container.appendChild(div);
  });
}

function renderTOC() {
  const tc = document.getElementById('toc-compare');
  const ts = document.getElementById('toc-search');
  tc.innerHTML = ''; ts.innerHTML = '';
  PASSAGES.forEach((p, idx) => {
    const dc = Object.keys(state.results[p.id]||{}).length;
    const d = document.createElement('div');
    d.className = 'index-item' + (dc === p.questions.length ? ' done' : '');
    d.textContent = `第${idx+1}篇 ${p.title} ${dc>0?`✓${dc}/${p.questions.length}`:''}`;
    d.onclick = () => navigateTo(p.id);
    (p.type==='compare'?tc:ts).appendChild(d);
  });
}

function showOnly(id) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  const target = document.getElementById('page-' + id);
  if (target) target.classList.add('active');
}

function navigateTo(id) {
  state.current = id;
  showOnly(id);
  renderTOC(); updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

// Event delegation for answer clicks
document.addEventListener('click', (e) => {
  const opt = e.target.closest('.option');
  if (!opt || opt.classList.contains('disabled')) return;
  const pageEl = opt.closest('.page');
  if (!pageEl) return;
  const pid = pageEl.id.replace('page-','');
  const p = PASSAGES.find(x => x.id === pid);
  const qi = Array.from(pageEl.querySelectorAll('.question')).indexOf(opt.closest('.question'));
  const oi = Array.from(opt.parentElement.querySelectorAll('.option')).indexOf(opt);
  if (!state.answered[pid]) state.answered[pid] = {};
  if (state.answered[pid][qi]) return;
  state.answers[pid] = state.answers[pid] || {};
  state.results[pid] = state.results[pid] || {};
  state.answers[pid][qi] = oi;
  state.answered[pid][qi] = true;
  state.results[pid][qi] = oi === p.questions[qi].answer;
  // rebuild just this page
  const idx = PASSAGES.indexOf(p);
  const oldEl = pageEl;
  build(); // rebuild all
  showOnly(pid);
  renderTOC(); updateProgress();
});

function resetPassage(pid) {
  delete state.answers[pid]; delete state.results[pid]; delete state.answered[pid];
  build(); showOnly(pid); renderTOC(); updateProgress();
}

function updateProgress() {
  let total=0, correct=0;
  PASSAGES.forEach(p => total += p.questions.length);
  Object.values(state.results).forEach(r => Object.values(r).forEach(v => { if (v) correct++; }));
  document.getElementById('score-text').textContent = correct;
  document.getElementById('total-text').textContent = total;
  document.getElementById('overall-progress').style.width = (total>0 ? (correct/total*100) : 0) + '%';
}

build();
renderTOC();
updateProgress();
</script>
