<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N2 阅读理解 - 对比题 & 检索题</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Yu Gothic", "Noto Sans CJK JP", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    line-height: 1.8;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    color: white;
    margin-bottom: 30px;
    padding: 30px 20px;
  }
  header h1 { font-size: 2.2em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  header p { font-size: 1.1em; opacity: 0.9; }

  .index-card {
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    margin-bottom: 25px;
    display: none;
  }
  .index-card.active { display: block; animation: fadeIn 0.4s ease; }

  .index-card h3 { color: #4a5568; margin-bottom: 15px; font-size: 1.1em; }
  .index-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .index-item {
    padding: 12px 15px;
    background: #f7fafc;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.92em;
    color: #4a5568;
    text-align: left;
  }
  .index-item:hover {
    background: #edf2f7;
    border-color: #667eea;
    transform: translateY(-2px);
  }
  .index-item.done { border-color: #48bb78; background: #f0fff4; color: #22543d; }

  .passage {
    background: white;
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    display: none;
  }
  .passage.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .passage-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 15px;
    margin-bottom: 20px;
  }
  .passage-title {
    font-size: 1.3em;
    font-weight: bold;
    color: #2d3748;
  }
  .passage-meta {
    font-size: 0.85em;
    color: #a0aec0;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: bold;
    color: white;
    margin-left: 8px;
  }
  .badge-compare { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
  .badge-search { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }

  .article-a, .article-b {
    background: #f7fafc;
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 18px;
  }
  .article-a { border-left: 5px solid #f5576c; }
  .article-b { border-left: 5px solid #4facfe; }
  .article-label {
    font-weight: bold;
    font-size: 1.05em;
    margin-bottom: 8px;
    padding-bottom: 5px;
    border-bottom: 1px dashed #cbd5e0;
  }
  .article-a .article-label { color: #f5576c; }
  .article-b .article-label { color: #4facfe; }
  .article-body { color: #2d3748; font-size: 0.98em; text-align: justify; }

  .search-article {
    background: #fffaf0;
    border: 2px dashed #ed8936;
    border-radius: 10px;
    padding: 20px 25px;
    margin-bottom: 20px;
  }
  .search-article h4 { color: #c05621; margin-bottom: 12px; font-size: 1.15em; }
  .info-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  .info-table th, .info-table td {
    padding: 8px 12px;
    border: 1px solid #fbd38d;
    text-align: left;
  }
  .info-table th {
    background: #feebc8;
    color: #c05621;
    width: 30%;
    font-weight: bold;
  }
  .highlight { background: #fefcbf; padding: 2px 6px; border-radius: 3px; }

  .question {
    background: #edf2f7;
    border-radius: 10px;
    padding: 18px 22px;
    margin-bottom: 15px;
  }
  .question-text { font-size: 1.05em; font-weight: bold; color: #2d3748; margin-bottom: 12px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    padding: 12px 18px;
    background: white;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.95em;
  }
  .option:hover { border-color: #667eea; background: #ebf4ff; }
  .option.selected { border-color: #667eea; background: #667eea; color: white; }
  .option.correct { border-color: #48bb78; background: #48bb78; color: white; }
  .option.wrong { border-color: #f56565; background: #fed7d7; color: #c53030; }
  .option.disabled { cursor: default; }

  .answer-box { display: none; margin-top: 15px; padding: 15px 20px; border-radius: 8px; }
  .answer-box.show { display: block; animation: fadeIn 0.3s; }
  .answer-box.correct-box { background: #f0fff4; border: 2px solid #48bb78; }
  .answer-box.wrong-box { background: #fff5f5; border: 2px solid #f56565; }
  .answer-label { font-weight: bold; margin-bottom: 8px; font-size: 1.05em; }
  .correct-box .answer-label { color: #22543d; }
  .wrong-box .answer-label { color: #c53030; }
  .explanation { color: #4a5568; font-size: 0.93em; }

  .action-buttons { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95em;
    font-weight: bold;
    transition: all 0.2s;
  }
  .btn-secondary { background: #e2e8f0; color: #4a5568; }
  .btn-secondary:hover { background: #cbd5e0; }
  .btn-nav { background: white; color: #667eea; border: 2px solid #667eea; }
  .btn-nav:hover { background: #667eea; color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .progress-bar { background: #e2e8f0; border-radius: 10px; height: 10px; overflow: hidden; margin: 15px 0; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #48bb78, #38a169);
    transition: width 0.4s ease;
    border-radius: 10px;
  }
  .score-display { text-align: center; padding: 20px; font-size: 1.1em; color: #4a5568; }
  .score-highlight { font-size: 1.4em; font-weight: bold; color: #667eea; }
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 2px solid #e2e8f0;
  }

  .toc-section { margin-bottom: 30px; }
  .toc-section h2 {
    color: white;
    font-size: 1.3em;
    margin-bottom: 15px;
    padding-left: 10px;
    border-left: 4px solid #ffd700;
  }

  @media (max-width: 640px) {
    .passage { padding: 20px 15px; }
    header h1 { font-size: 1.6em; }
    .index-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>JLPT N2 阅读理解</h1>
    <p>比較読解 &amp; 情報検索読解 · 各10篇 · 全20篇40問</p>
  </header>

  <!-- 封面/目录页 -->
  <div class="index-card active" id="cover-page">
    <div class="passage-header" style="border-bottom:2px solid #e2e8f0;padding-bottom:15px;margin-bottom:20px;">
      <div class="passage-title">📖 目次 · Index</div>
    </div>
    <p style="color:#4a5568;margin-bottom:20px;font-size:0.95em;">
      本页面包含两大类N2级别阅读练习，共20篇文章、40道问题。点击下方卡片开始练习，完成后可查看答案和解析。
    </p>
    <div class="toc-section">
      <h2>🔴 比較読解（对比题）</h2>
      <div class="index-grid" id="toc-compare"></div>
    </div>
    <div class="toc-section">
      <h2>🔵 情報検索読解（检索题）</h2>
      <div class="index-grid" id="toc-search"></div>
    </div>
    <div class="score-display">
      <div>本次练习进度</div>
      <div class="progress-bar"><div class="progress-fill" id="overall-progress" style="width:0%"></div></div>
      <div><span class="score-highlight" id="score-text">0</span> / <span id="total-text">0</span> 题正确</div>
    </div>
  </div>

  <!-- 文章页容器 -->
  <div id="passages-container"></div>
</div>

<script>
/* ====================== 题库数据 ====================== */
const PASSAGES = [
  // ========== 对比题 (Compare) ==========
  {
    type: 'compare', id: 'c1', title: 'オンライン講座と通学講座', meta: '比較読解 第1篇',
    tagA: 'Aさんの意見', tagB: 'Bさんの意見',
    articleA: `私はオンライン講座の方が良いと思います。理由は三つあります。一つ目は、時間の融通がきくことです。朝早く起きる必要もなければ、夜遅くまで授業を受けることもできます。仕事やアルバイトと両立しやすいです。

二つ目は、場所を選ばないことです。自宅のパソコンやスマートフォンがあれば、どこでも授業を受けられます。家から出たくない日や、台風で外に出られない日でも安心です。

三つ目は、繰り返し視聴できることです。分からなかった箇所を巻き戻して見直したり、字幕を出して聞き取り練習をしたりできます。私は何度も見て、だんだん理解が深まりました。費用も通学講座より安いことが多いです。`,
    articleB: `私は通学講座の方が良いと思います。理由は二つあります。一つ目は、先生や他の受講生と直接会えることです。授業の後に分からないことを質問したり、クラスメートと情報交換したりできます。オンラインではチャットでのやり取りになりますが、直接話すのとは違います。

二つ目は、集中しやすい環境です。自宅にはテレビや冷蔵庫、スマートフォンの通知など、誘惑がたくさんあります。一方、学校の教室は勉強するための場所なので、自然と集中できます。私はオンライン講座を一度受けましたが、途中で寝てしまったことが何度かあります。

また、通学することで生活リズムが整うのも良い点です。`,
    questions: [
      { q: 'AさんとBさんが共通して「オンライン講座」について言及していることは何か？',
        options: ['時間の融通がきくこと','通学講座より費用が安いこと','集中しにくい場合があること','直接先生に質問できないこと'],
        answer: 2, explain: 'Aさんはオンライン講座の利点として時間の融通と繰り返し視聴を挙げています。Bさんは自身がオンライン講座を受けた際に集中できなかった経験を語っています。両者とも「オンライン講座には集中しにくい場合がある」という点について言及しています。' },
      { q: 'Bさんが通学講座を支持する最も重要な理由は何か？',
        options: ['費用が比較的安いから','直接の交流と集中できる環境があるから','繰り返し学習ができるから','場所を選ばないから'],
        answer: 1, explain: 'Bさんは通学講座の利点として「先生や他の受講生と直接会えること」と「集中しやすい環境」の二点を挙げています。この選択肢はこれらをまとめたものです。' }
    ]
  },
  {
    type: 'compare', id: 'c2', title: '電子書籍と紙の本', meta: '比較読解 第2篇',
    tagA: 'Aさんの意見', tagB: 'Bさんの意見',
    articleA: `私は電子書籍の方が好きです。何と言っても、一つの端末に何百冊も入れられるのが最大の利点です。旅行の時も、荷物にならないので便利です。

また、文字の大きさを変えられるのも良いです。目が疲れてきたら大きくしたり、雰囲気に合わせてフォントを変えたりできます。暗い場所でも読めますし、蛍光灯のように目に優しいモードもあります。

買いたい時も、ワンクリックですぐに読めます。本屋に行く時間もないし、売り切れている心配もありません。`,
    articleB: `私はやっぱり紙の本が好きです。まず、ページをめくる感触がたまりません。読み進めるにつれて分厚くなっていく背表紙を見ると、達成感があります。

また、電子書籍は充電が切れたら読めません。紙の本にはそんな心配はありません。温泉に持ち込んでも大丈夫だし、災害時にも役立ちます。

それから、本棚に並べてインテリアとして楽しむこともできます。好きな本をコレクションするのは、電子書籍にはない楽しみです。`,
    questions: [
      { q: 'AさんとBさんの両方が、それぞれ好きな媒体の利点として挙げていることはどれか？',
        options: ['持ち運びが便利なこと','読書中の充電の心配がないこと','インテリアとして楽しめること','ページをめくる感触が良いこと'],
        answer: 0, explain: 'Aさんは電子書籍の利点として「荷物にならない」持ち運びの便利さを挙げ、Bさんは紙の本の利点として「充電が切れたら読めない」電子書籍の欠点を挙げた上で、温泉や災害時でも使える点を挙げています。両者とも間接的に「持ち運び」に関する利便性に触れています。' },
      { q: 'Bさんが紙の本を好む理由として挙げていないものはどれか？',
        options: ['読書の達成感がある','充電を気にしなくて良い','文字の大きさを変えられる','インテリアとして楽しめる'],
        answer: 2, explain: '「文字の大きさを変えられる」はAさんが挙げた電子書籍の利点で、Bさんの紙の本の利点としては触れられていません。' }
    ]
  },
  {
    type: 'compare', id: 'c3', title: 'リモートワークとオフィスワーク', meta: '比較読解 第3篇',
    tagA: 'Aさんの意見', tagB: 'Bさんの意見',
    articleA: `私はリモートワークが好きです。まず、通勤時間がなくなりました。往復2時間かかっていたので、その時間を読書や家事に使えるようになりました。また、通勤のストレスもなくなり、朝起きるのも楽になりました。

服装も自由です。スウェットで仕事をしても誰にも文句を言われません。お昼ご飯も、自分で作ったり近くのスーパーで買ったりして、健康的になりました。

ただ、時々集中できないこともあります。テレビを見てしまったり、昼寝してしまったり…。でも、自分なりの工夫をして、だいぶ慣れてきました。`,
    articleB: `私はやっぱりオフィスに行って仕事をしたいです。リモートだと、同僚との会話が減ってしまいました。お茶を飲みながらの雑談や、帰りの居酒屋での会話が大好きだったのに、今はそれがありません。新しいアイデアも、顔を合わせて話すことで生まれることが多いと思います。

また、リモートだとオンとオフの切り替えが難しいです。仕事が終わっても家にいるので、いつまでもPCの前に座ってしまいます。残業が増えた気がします。

子供がいるので、オフィスに行っている間に保育園に預けられるのも、私にとっては大きな利点です。`,
    questions: [
      { q: 'AさんとBさんの両方が感じているリモートワークの問題点は何か？',
        options: ['通勤時間がかかること','同僚との会話が減ること','オンとオフの切り替えが難しいこと','服装が自由であること'],
        answer: 2, explain: 'Aさんは「時々集中できない」と述べ、Bさんは「オンとオフの切り替えが難しい」と言っています。両者とも、自宅で仕事をすることによる集中力や切り替えの問題に触れています。' },
      { q: 'Bさんがオフィスワークを望む理由として、最も個人的な背景に基づいているものはどれか？',
        options: ['新しいアイデアが生まれやすい','同僚との雑談が好き','お茶を飲める','子供を保育園に預けられる'],
        answer: 3, explain: '最後の文に「子供がいるので、オフィスに行っている間に保育園に預けられるのも、私にとっては大きな利点です」とあり、これはBさんの個人的な家庭状況に基づく最も具体的な理由です。' }
    ]
  },
  {
    type: 'compare', id: 'c4', title: '太陽光発電と原子力発電', meta: '比較読解 第4篇',
    tagA: 'Aさんの意見', tagB: 'Bさんの意見',
    articleA: `太陽光発電は素晴らしいと思います。まず、環境に優しいです。二酸化炭素を排出しないし、太陽の光があれば発電できるので、枯渇する心配もありません。原子力発電は廃棄物の処理問題がありますが、太陽光にはそれがありません。

また、屋根にパネルを付ければ、個人でも発電できます。大規模な設備が必要な原子力とは違い、分散型のエネルギーとして利用できます。災害時にも、停電しても使えるのは心強いです。

ただし、天気に左右されるのが欠点です。曇りや雨の日は発電量が減ります。`,
    articleB: `私は原子力発電を止めるべきではないと考えています。まず、発電コストが安いです。一度建設すると、長期的に安定して電気を供給できます。太陽光発電は天気に左右されるし、夜は発電できません。蓄電池の技術がまだ不十分な今の段階では、太陽光だけでは足りません。

また、二酸化炭素の排出量は、原子力発電も太陽光発電も同じくらい少ないです。環境への影響だけで見れば、両者とも優れています。

問題は、廃棄物の処理です。これは国全体で取り組むべき課題であり、解決不可能な問題ではないと思います。`,
    questions: [
      { q: 'AさんとBさんが両者に共通して言及している点は何か？',
        options: ['太陽光は環境に優しい','原子力発電は廃棄物処理問題がある','太陽光は天気に左右される','二酸化炭素排出量は両者とも少ない'],
        answer: 1, explain: 'Aさんは「原子力発電は廃棄物の処理問題があります」と述べ、Bさんは「問題は、廃棄物の処理です」と言っています。両者とも原子力発電の廃棄物処理問題に言及しています。' },
      { q: 'Bさんが原子力発電を支持する理由として挙げているのはどれか？',
        options: ['個人でも発電できる','発電コストが安く安定供給できる','災害時にも使える','パネルを屋根に付けられる'],
        answer: 1, explain: 'Bさんは「まず、発電コストが安いです。一度建設すると、長期的に安定して電気を供給できます」と述べています。' }
    ]
  },
  {
    type: 'compare', id: 'c5', title: '私立学校と公立学校', meta: '比較読解 第5篇',
    tagA: 'Aさんの意見', tagB: 'Bさんの意見',
    articleA: `私立学校の方が良いと思います。まず、教育方針が明確です。学校ごとに特色があり、英語教育に力を入れているところ、スポーツが盛んなところなど、自分に合った学校を選べます。

また、教師の質が高いです。生徒の学力を伸ばすことを第一に考えている先生が多く、熱心に指導してくれます。少人数制のクラスが多いので、先生の目が行き届きます。

ただ、学費が高いのが難点です。親には本当に感謝しています。`,
    articleB: `公立学校の方が良いと思います。まず、学費が安いです。家計に優しいし、誰もが平等に教育を受けられる制度です。教育の機会均等が保障されているのは大切なことです。

また、さまざまな背景の子供が集まります。お金持ちの子も、そうでない子も、地域のいろいろな人たちと接することで、視野が広がります。私立は同じような家庭の子が集まりがちですが、公立の方が社会の縮図のようで、良い経験になります。

学費以外でも、給食や遠足などの費用も安く、親の負担が少ないです。`,
    questions: [
      { q: 'AさんとBさんが両方の学校について共通して言及している点は何か？',
        options: ['少人数制である','学費のこと','英語教育が盛んである','教師の熱心さ'],

  currentPassage: 'cover-page',
  answers: {},
  results: {},
  answered: {}
};

/* ====================== 渲染 ====================== */
function renderTOC() {
  const tocCompare = document.getElementById('toc-compare');
  const tocSearch = document.getElementById('toc-search');
  tocCompare.innerHTML = '';
  tocSearch.innerHTML = '';

  PASSAGES.forEach((p, idx) => {
    const doneCount = (state.results[p.id] || {}).count ? 0 : Object.keys(state.results[p.id] || {}).length;
    const div = document.createElement('div');
    div.className = 'index-item' + (doneCount === p.questions.length ? ' done' : '');
    div.dataset.passageId = p.id;
    div.textContent = `第${idx+1}篇 ${p.title} ${doneCount > 0 ? `✓${doneCount}/${p.questions.length}` : ''}`;
    div.onclick = () => navigateTo(p.id);
    if (p.type === 'compare') tocCompare.appendChild(div);
    else tocSearch.appendChild(div);
  });
}

  const badgeClass = p.type === 'compare' ? 'badge-compare' : 'badge-search';
  const badgeText = p.type === 'compare' ? '比較読解' : '情報検索';

      <div class="passage-meta">${p.meta}</div>
    </div>
  `;

  if (p.type === 'compare') {
    content += `
      <div class="article-a">
        <div class="article-label">● ${p.tagA}</div>
        <div class="article-body">${p.articleA.replace(/\n/g, '<br>')}</div>
      </div>
      <div class="article-b">
        <div class="article-label">● ${p.tagB}</div>
        <div class="article-body">${p.articleB.replace(/\n/g, '<br>')}</div>
      </div>
    `;
  } else {
    content += `
      <div class="search-article">
        ${p.searchContent}
      </div>
    `;
  }

  // Questions
  p.questions.forEach((q, qi) => {
    const answered = state.answered[p.id] && state.answered[p.id][qi];
    const selected = state.answers[p.id] && state.answers[p.id][qi];
    const correct = state.results[p.id] && state.results[p.id][qi];

    content += `
      <div class="question">
        <div class="question-text">【問題${qi+1}】${q.q}</div>
        <div class="options">
    `;
    q.options.forEach((opt, oi) => {
      let cls = 'option';
      if (answered) {
        cls += ' disabled';
        if (oi === q.answer) cls += ' correct';
        else if (oi === selected) cls += ' wrong';
      } else if (selected === oi) {
        cls += ' selected';
      }
      content += `<div class="${cls}" data-q="${qi}" data-opt="${oi}">${String.fromCharCode(65+oi)}. ${opt}</div>`;
    });
    content += '</div>';

    if (answered) {
      const boxClass = correct ? 'correct-box show' : 'wrong-box show';
      const labelText = correct ? '✓ 正解！' : '✗ 不正解…正解は ' + String.fromCharCode(65 + q.answer) + ' です。';
      content += `
        <div class="answer-box ${boxClass}">
          <div class="answer-label">${labelText}</div>
          <div class="explanation">${q.explain}</div>
        </div>
      `;
    }
    content += '</div>';
  });

  // Action buttons + nav
  const prevId = idx > 0 ? PASSAGES[idx-1].id : null;
  const nextId = idx < PASSAGES.length - 1 ? PASSAGES[idx+1].id : null;

  content += `
    <div class="action-buttons">
      <button class="btn btn-secondary" onclick="resetPassage('${p.id}')">🔄 このページをリセット</button>
      <button class="btn btn-secondary" onclick="navigateTo('cover-page')">📋 目次へ戻る</button>
    </div>
    <div class="nav-buttons">
      <button class="btn btn-nav" ${!prevId ? 'disabled' : ''} onclick="${prevId ? `navigateTo('${prevId}')` : ''}">← 前の篇</button>
      <button class="btn btn-nav" ${!nextId ? 'disabled' : ''} onclick="${nextId ? `navigateTo('${nextId}')` : ''}">次の篇 →</button>
    </div>
  `;

  const wrapper = document.createElement('div');
  wrapper.className = 'passage';
  wrapper.id = p.id;
  wrapper.innerHTML = content;

  // Bind click events on options
  wrapper.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', () => {
      if (opt.classList.contains('disabled')) return;
      const qIdx = parseInt(opt.dataset.q);
      const oIdx = parseInt(opt.dataset.opt);
      selectOption(p.id, qIdx, oIdx);
    });
  });

  return wrapper;
}

function buildAllPassages() {
  const container = document.getElementById('passages-container');
  container.innerHTML = '';
  PASSAGES.forEach((p, idx) => {
    container.appendChild(renderPassage(p, idx));
  });
}

function showOnly(id) {
  // Hide all index-cards and passages
  document.querySelectorAll('.index-card').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.passage').forEach(el => el.classList.remove('active'));
  // Show target
  const target = document.getElementById(id);
  if (target) target.classList.add('active');
}

function navigateTo(id) {
  state.currentPassage = id;
  showOnly(id);
  renderTOC();
  updateProgress();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function selectOption(passageId, qIdx, optIdx) {
  if (!state.answers[passageId]) state.answers[passageId] = {};
  if (!state.results[passageId]) state.results[passageId] = {};
  if (!state.answered[passageId]) state.answered[passageId] = {};

  if (state.answered[passageId][qIdx]) return;

  const p = PASSAGES.find(x => x.id === passageId);
  state.answers[passageId][qIdx] = optIdx;
  state.answered[passageId][qIdx] = true;
  state.results[passageId][qIdx] = optIdx === p.questions[qIdx].answer;

  // Re-render this single passage
  const idx = PASSAGES.indexOf(p);
  const oldEl = document.getElementById(passageId);
  const newEl = renderPassage(p, idx);
  oldEl.replaceWith(newEl);
  newEl.classList.add('active');

  renderTOC();
  updateProgress();
}

function resetPassage(passageId) {
  if (state.answers[passageId]) delete state.answers[passageId];
  if (state.results[passageId]) delete state.results[passageId];
  if (state.answered[passageId]) delete state.answered[passageId];

  const p = PASSAGES.find(x => x.id === passageId);
  const idx = PASSAGES.indexOf(p);
  const oldEl = document.getElementById(passageId);
  const newEl = renderPassage(p, idx);
  oldEl.replaceWith(newEl);
  newEl.classList.add('active');

  renderTOC();
  updateProgress();
}

function updateProgress() {
  let total = 0, correct = 0;
  PASSAGES.forEach(p => {
    p.questions.forEach((q, qi) => {
      total++;
      if (state.results[p.id] && state.results[p.id][qi]) correct++;
    });
  });

  const scoreEl = document.getElementById('score-text');
  const totalEl = document.getElementById('total-text');
  const progressEl = document.getElementById('overall-progress');

  if (scoreEl) scoreEl.textContent = correct;
  if (totalEl) totalEl.textContent = total;
  if (progressEl) progressEl.style.width = (total > 0 ? (correct/total*100) : 0) + '%';
}

// Init
buildAllPassages();
renderTOC();
updateProgress();
</script>
</body>
</html>
